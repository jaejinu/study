<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="430" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">머리 막힘(HOL)은 어디에 있나 — 패킷 하나(✗)가 무엇을 세우는가</text>

  <!-- HTTP/1.1 x6 -->
  <text x="40" y="75" fill="#e6edf3" font-weight="600">HTTP/1.1 · 연결 6개</text>
  <text x="40" y="94" fill="#8b949e" font-size="11">손실은 그 연결만 세운다</text>
  <g>
    <rect x="260" y="60" width="600" height="14" rx="3" fill="#1f2937"/><rect x="260" y="60" width="600" height="14" rx="3" fill="#3b82f6" opacity="0.7"/>
    <rect x="260" y="78" width="600" height="14" rx="3" fill="#ef4444" opacity="0.35"/><text x="420" y="90" fill="#ef4444" font-size="11">✗ 이 연결만 재전송 대기</text>
    <rect x="260" y="96" width="600" height="14" rx="3" fill="#3b82f6" opacity="0.7"/>
  </g>

  <!-- HTTP/2 -->
  <text x="40" y="160" fill="#e6edf3" font-weight="600">HTTP/2 · TCP 1개, 스트림 다중화</text>
  <text x="40" y="179" fill="#8b949e" font-size="11">TCP 가 바이트 순서를 지켜 모든 스트림이 멈춘다</text>
  <g>
    <rect x="260" y="150" width="60" height="28" fill="#3b82f6"/><text x="290" y="169" text-anchor="middle" fill="#0d1117" font-size="11">S1</text>
    <rect x="322" y="150" width="60" height="28" fill="#ef4444"/><text x="352" y="169" text-anchor="middle" fill="#0d1117" font-size="11">S3 ✗</text>
    <rect x="384" y="150" width="60" height="28" fill="#22c55e" opacity="0.4"/><text x="414" y="169" text-anchor="middle" fill="#e6edf3" font-size="11">S5</text>
    <rect x="446" y="150" width="60" height="28" fill="#3b82f6" opacity="0.4"/><text x="476" y="169" text-anchor="middle" fill="#e6edf3" font-size="11">S1</text>
    <rect x="508" y="150" width="60" height="28" fill="#f59e0b" opacity="0.4"/><text x="538" y="169" text-anchor="middle" fill="#e6edf3" font-size="11">S7</text>
    <text x="590" y="169" fill="#ef4444" font-size="12">← 도착했지만 앱에 못 줌</text>
  </g>

  <!-- HTTP/3 -->
  <text x="40" y="245" fill="#e6edf3" font-weight="600">HTTP/3 · QUIC, 스트림별 순서</text>
  <text x="40" y="264" fill="#8b949e" font-size="11">손실된 스트림(S3)만 기다린다</text>
  <g>
    <rect x="260" y="235" width="60" height="28" fill="#3b82f6"/><text x="290" y="254" text-anchor="middle" fill="#0d1117" font-size="11">S1</text>
    <rect x="322" y="235" width="60" height="28" fill="#ef4444"/><text x="352" y="254" text-anchor="middle" fill="#0d1117" font-size="11">S3 ✗</text>
    <rect x="384" y="235" width="60" height="28" fill="#22c55e"/><text x="414" y="254" text-anchor="middle" fill="#0d1117" font-size="11">S5</text>
    <rect x="446" y="235" width="60" height="28" fill="#3b82f6"/><text x="476" y="254" text-anchor="middle" fill="#0d1117" font-size="11">S1</text>
    <rect x="508" y="235" width="60" height="28" fill="#f59e0b"/><text x="538" y="254" text-anchor="middle" fill="#0d1117" font-size="11">S7</text>
    <text x="590" y="254" fill="#22c55e" font-size="12">← S1·S5·S7 은 바로 앱으로</text>
  </g>

  <rect x="40" y="300" width="880" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="325" fill="#f59e0b" font-weight="600">실험 netp-h1-vs-h2 (20KB × 50, 지연 50ms) — 손실 2% 를 더했을 때 느려진 배수</text>
  <rect x="60" y="340" width="232" height="18" fill="#3b82f6" opacity="0.8"/><text x="300" y="354" fill="#e6edf3">HTTP/1.1 × 6 연결: 1.16배</text>
  <rect x="60" y="366" width="346" height="18" fill="#ef4444" opacity="0.8"/><text x="414" y="380" fill="#e6edf3">HTTP/2 × 1 연결: 1.73배 — TCP 머리 막힘</text>
  <text x="60" y="400" fill="#8b949e" font-size="11">1KB × 50 에서는 HTTP/2 가 가장 빨랐다(304ms vs HTTP/1.1×6 576ms): 다중화는 요청 왕복을 없애지만, 연결 하나의 손실 내성은 키우지 못한다.</text>
</svg>
