<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="380" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">드리프트 감시 루프 — plan 을 cron 으로, exit 2 를 알림으로</text>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <rect x="30" y="70" width="170" height="70" rx="10" fill="#161b22" stroke="#dc2626"/><text x="115" y="95" text-anchor="middle" fill="#dc2626" font-weight="600">코드 밖 변경</text><text x="115" y="113" text-anchor="middle" fill="#8b949e" font-size="11">콘솔 클릭 · 핫픽스</text><text x="115" y="128" text-anchor="middle" fill="#8b949e" font-size="11">docker rm · 다른 자동화</text>
  <line x1="200" y1="105" x2="238" y2="105" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="240" y="70" width="190" height="70" rx="10" fill="#161b22" stroke="#8b5cf6"/><text x="335" y="95" text-anchor="middle" fill="#8b5cf6" font-weight="600">CI cron (30분)</text><text x="335" y="113" text-anchor="middle" fill="#e6edf3" font-size="11">tofu plan -detailed-exitcode</text><text x="335" y="128" text-anchor="middle" fill="#8b949e" font-size="11">읽기 전용 역할 (OIDC) · -lock=false</text>
  <line x1="430" y1="105" x2="468" y2="105" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="60" width="130" height="90" rx="10" fill="#161b22" stroke="#f59e0b"/><text x="535" y="85" text-anchor="middle" fill="#f59e0b" font-weight="600">exit code</text><text x="535" y="105" text-anchor="middle" fill="#22c55e" font-size="12">0 = 변경 없음</text><text x="535" y="122" text-anchor="middle" fill="#dc2626" font-size="12">1 = 오류</text><text x="535" y="139" text-anchor="middle" fill="#f59e0b" font-size="12">2 = 드리프트!</text>
  <line x1="600" y1="105" x2="638" y2="105" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="640" y="70" width="290" height="70" rx="10" fill="#161b22" stroke="#3b82f6"/><text x="785" y="95" text-anchor="middle" fill="#3b82f6" font-weight="600">웹훅 → /api/alerts → 대시보드</text><text x="785" y="113" text-anchor="middle" fill="#8b949e" font-size="11">alertname=TerraformDrift severity=warning</text><text x="785" y="128" text-anchor="middle" fill="#8b949e" font-size="11">plan 요약을 annotations 에</text>
  <text x="480" y="190" text-anchor="middle" fill="#e6edf3" font-weight="600">해결은 사람이 정한다</text>
  <rect x="60" y="210" width="260" height="110" rx="10" fill="#161b22" stroke="#22c55e"/><text x="190" y="235" text-anchor="middle" fill="#22c55e" font-weight="600">코드가 맞다 → apply</text><text x="190" y="258" text-anchor="middle" fill="#8b949e" font-size="11">핫픽스를 되돌리고 코드로 다시</text><text x="190" y="276" text-anchor="middle" fill="#8b949e" font-size="11">삭제됐으면 재생성 (1 to add)</text><text x="190" y="300" text-anchor="middle" fill="#f59e0b" font-size="11">인프라는 자동 복구 신중 (교체 = 손실)</text>
  <rect x="350" y="210" width="260" height="110" rx="10" fill="#161b22" stroke="#3b82f6"/><text x="480" y="235" text-anchor="middle" fill="#3b82f6" font-weight="600">변경이 옳다 → 코드 수정</text><text x="480" y="258" text-anchor="middle" fill="#8b949e" font-size="11">PR 로 반영 → plan 이 No changes</text><text x="480" y="276" text-anchor="middle" fill="#8b949e" font-size="11">state 만 틀리면 apply -refresh-only</text><text x="480" y="300" text-anchor="middle" fill="#8b949e" font-size="11">외부 생성 리소스는 import</text>
  <rect x="640" y="210" width="260" height="110" rx="10" fill="#161b22" stroke="#8b5cf6"/><text x="770" y="235" text-anchor="middle" fill="#8b5cf6" font-weight="600">다른 시스템이 정당히 바꾼다</text><text x="770" y="258" text-anchor="middle" fill="#8b949e" font-size="11">HPA replicas · 오토스케일러</text><text x="770" y="276" text-anchor="middle" fill="#e6edf3" font-size="11">lifecycle { ignore_changes = [...] }</text><text x="770" y="300" text-anchor="middle" fill="#8b949e" font-size="11">= ArgoCD 의 ignoreDifferences</text>
  <text x="480" y="360" text-anchor="middle" fill="#8b949e" font-size="11">실험: iac-drift-detect (삭제 → 1 to add, 손수 재생성 → ID 불일치 → 재생성 제안)</text>
</svg>
