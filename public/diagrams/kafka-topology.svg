<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="ui-sans-serif, system-ui, 'Apple SD Gothic Neo', sans-serif" font-size="12.5">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8b98a9"/></marker></defs>
  <rect width="900" height="360" fill="#0d1117"/>
  <text x="30" y="32" fill="#e6edf3" font-weight="600" font-size="15">토픽 · 파티션 · 컨슈머 그룹 — 실험 "kafka-consumer-groups" 의 모습</text>
  <rect x="30" y="140" width="120" height="48" rx="8" fill="#1a222e" stroke="#243040"/><text x="46" y="160" fill="#e6edf3" font-weight="600">Producer</text><text x="46" y="178" fill="#8b98a9" font-size="11">key → 파티션</text>
  <rect x="200" y="60" width="300" height="240" rx="10" fill="#121821" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="216" y="84" fill="#a78bfa" font-weight="600">topic: lab_events (파티션 3)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11">
    <rect x="216" y="100" width="268" height="44" rx="6" fill="#1a222e" stroke="#243040"/><text x="226" y="118" fill="#e6edf3">p0</text><g fill="#8b5cf6"><rect x="250" y="110" width="22" height="22" rx="3"/><rect x="276" y="110" width="22" height="22" rx="3"/><rect x="302" y="110" width="22" height="22" rx="3"/><rect x="328" y="110" width="22" height="22" rx="3"/></g><text x="258" y="126" fill="#fff">0</text><text x="284" y="126" fill="#fff">1</text><text x="310" y="126" fill="#fff">2</text><text x="336" y="126" fill="#fff">3</text><text x="360" y="126" fill="#8b98a9">… log-end 10</text>
    <rect x="216" y="156" width="268" height="44" rx="6" fill="#1a222e" stroke="#243040"/><text x="226" y="174" fill="#e6edf3">p1</text><g fill="#8b5cf6"><rect x="250" y="166" width="22" height="22" rx="3"/><rect x="276" y="166" width="22" height="22" rx="3"/><rect x="302" y="166" width="22" height="22" rx="3"/></g><text x="258" y="182" fill="#fff">0</text><text x="284" y="182" fill="#fff">1</text><text x="310" y="182" fill="#fff">2</text><text x="360" y="182" fill="#8b98a9">… log-end 10</text>
    <rect x="216" y="212" width="268" height="44" rx="6" fill="#1a222e" stroke="#243040"/><text x="226" y="230" fill="#e6edf3">p2</text><g fill="#8b5cf6"><rect x="250" y="222" width="22" height="22" rx="3"/><rect x="276" y="222" width="22" height="22" rx="3"/><rect x="302" y="222" width="22" height="22" rx="3"/><rect x="328" y="222" width="22" height="22" rx="3"/><rect x="354" y="222" width="22" height="22" rx="3"/></g><text x="258" y="238" fill="#fff">0</text><text x="284" y="238" fill="#fff">1</text><text x="310" y="238" fill="#fff">2</text><text x="336" y="238" fill="#fff">3</text><text x="362" y="238" fill="#fff">4</text><text x="386" y="238" fill="#8b98a9">… 10</text>
  </g>
  <text x="216" y="282" fill="#8b98a9" font-size="11">같은 키 → 같은 파티션 → 순서 보장. 토픽 전체 순서는 없음</text>
  <path d="M150 164 H198" fill="none" stroke="#8b98a9" marker-end="url(#a)"/>
  <rect x="560" y="60" width="310" height="120" rx="10" fill="#121821" stroke="#3fb950"/>
  <text x="576" y="84" fill="#3fb950" font-weight="600">group: workers (파티션 분배)</text>
  <rect x="576" y="96" width="130" height="32" rx="6" fill="#1a222e" stroke="#243040"/><text x="586" y="117" fill="#e6edf3" font-size="11.5">w1 ← p0, p1</text>
  <rect x="720" y="96" width="130" height="32" rx="6" fill="#1a222e" stroke="#243040"/><text x="730" y="117" fill="#e6edf3" font-size="11.5">w2 ← p2</text>
  <text x="576" y="150" fill="#8b98a9" font-size="11">커밋 오프셋: p0=10 p1=10 p2=10 → LAG 0</text>
  <text x="576" y="166" fill="#8b98a9" font-size="11">컨슈머 추가/제거 → 리밸런스</text>
  <rect x="560" y="200" width="310" height="100" rx="10" fill="#121821" stroke="#58a6ff"/>
  <text x="576" y="224" fill="#58a6ff" font-weight="600">group: audit (독립 오프셋)</text>
  <text x="576" y="248" fill="#8b98a9" font-size="11.5">a1 ← p0, p1, p2 — 같은 30개를 전부 받음 (fan-out)</text>
  <text x="576" y="268" fill="#8b98a9" font-size="11.5">오프셋 리셋 → 처음부터 다시 (replay)</text>
  <g fill="none" stroke="#8b98a9" marker-end="url(#a)"><path d="M500 120 H558"/><path d="M500 250 H558"/></g>
  <text x="30" y="335" fill="#8b98a9" font-size="12">메시지는 소비돼도 보존 기간까지 남는다. LAG = log-end − 커밋 오프셋.</text>
</svg>
