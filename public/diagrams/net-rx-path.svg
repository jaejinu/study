<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="440" fill="#0d1117"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">패킷 수신 경로 — NIC 에서 앱의 read() 까지</text>
  <!-- hardware -->
  <rect x="30" y="60" width="150" height="80" rx="8" fill="#161b22" stroke="#8b949e"/>
  <text x="105" y="85" text-anchor="middle" fill="#e6edf3" font-weight="600">NIC</text>
  <text x="105" y="105" text-anchor="middle" fill="#8b949e" font-size="11">DMA → RX 링 버퍼</text>
  <text x="105" y="122" text-anchor="middle" fill="#8b949e" font-size="11">ethtool -S (drop)</text>
  <line x1="180" y1="100" x2="218" y2="100" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="220" y="60" width="150" height="80" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="295" y="85" text-anchor="middle" fill="#e6edf3" font-weight="600">하드 IRQ → NAPI</text>
  <text x="295" y="105" text-anchor="middle" fill="#8b949e" font-size="11">인터럽트 끄고 폴링</text>
  <text x="295" y="122" text-anchor="middle" fill="#8b949e" font-size="11">/proc/interrupts</text>
  <line x1="370" y1="100" x2="408" y2="100" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="410" y="60" width="160" height="80" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="490" y="85" text-anchor="middle" fill="#e6edf3" font-weight="600">softirq NET_RX</text>
  <text x="490" y="105" text-anchor="middle" fill="#8b949e" font-size="11">sk_buff 생성, GRO</text>
  <text x="490" y="122" text-anchor="middle" fill="#8b949e" font-size="11">softnet_stat · %soft</text>
  <line x1="570" y1="100" x2="608" y2="100" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="610" y="60" width="150" height="80" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="685" y="85" text-anchor="middle" fill="#e6edf3" font-weight="600">L2 / 브리지·veth</text>
  <text x="685" y="105" text-anchor="middle" fill="#8b949e" font-size="11">컨테이너면 +1 softirq</text>
  <text x="685" y="122" text-anchor="middle" fill="#8b949e" font-size="11">XDP·TC eBPF 훅</text>
  <line x1="760" y1="100" x2="798" y2="100" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="800" y="60" width="130" height="80" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="865" y="85" text-anchor="middle" fill="#e6edf3" font-weight="600">netfilter</text>
  <text x="865" y="105" text-anchor="middle" fill="#8b949e" font-size="11">conntrack · DNAT</text>
  <text x="865" y="122" text-anchor="middle" fill="#8b949e" font-size="11">PREROUTING/INPUT</text>
  <line x1="865" y1="140" x2="865" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- second row (right to left) -->
  <rect x="790" y="180" width="140" height="80" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="860" y="205" text-anchor="middle" fill="#e6edf3" font-weight="600">IP 라우팅</text>
  <text x="860" y="225" text-anchor="middle" fill="#8b949e" font-size="11">로컬 배달 결정</text>
  <line x1="790" y1="220" x2="752" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="590" y="180" width="160" height="80" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="670" y="205" text-anchor="middle" fill="#e6edf3" font-weight="600">TCP</text>
  <text x="670" y="225" text-anchor="middle" fill="#8b949e" font-size="11">순서·ACK·윈도우</text>
  <text x="670" y="242" text-anchor="middle" fill="#8b949e" font-size="11">nstat TcpExt*</text>
  <line x1="590" y1="220" x2="552" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="390" y="180" width="160" height="80" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="470" y="205" text-anchor="middle" fill="#e6edf3" font-weight="600">소켓 수신 버퍼</text>
  <text x="470" y="225" text-anchor="middle" fill="#8b949e" font-size="11">ss 의 Recv-Q</text>
  <text x="470" y="242" text-anchor="middle" fill="#8b949e" font-size="11">listen: accept 큐</text>
  <line x1="390" y1="220" x2="352" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="190" y="180" width="160" height="80" rx="8" fill="#161b22" stroke="#bc8cff"/>
  <text x="270" y="205" text-anchor="middle" fill="#e6edf3" font-weight="600">epoll 준비 목록</text>
  <text x="270" y="225" text-anchor="middle" fill="#8b949e" font-size="11">대기 스레드 깨움</text>
  <text x="270" y="242" text-anchor="middle" fill="#8b949e" font-size="11">스케줄링 지연!</text>
  <line x1="190" y1="220" x2="152" y2="220" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="30" y="180" width="120" height="80" rx="8" fill="#161b22" stroke="#bc8cff"/>
  <text x="90" y="205" text-anchor="middle" fill="#e6edf3" font-weight="600">앱 read()</text>
  <text x="90" y="225" text-anchor="middle" fill="#8b949e" font-size="11">Redis·Node</text>
  <text x="90" y="242" text-anchor="middle" fill="#8b949e" font-size="11">이벤트 루프</text>
  <!-- legend -->
  <rect x="30" y="290" width="900" height="130" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="315" fill="#e6edf3" font-weight="600">어디서 버려지나 / 어디서 느려지나</text>
  <text x="50" y="340" fill="#8b949e" font-size="12">• RX 링 가득 → NIC drop   • softirq 예산 소진 → time_squeeze   • conntrack 가득 → "table full, dropping packet"</text>
  <text x="50" y="362" fill="#8b949e" font-size="12">• accept 큐 가득 → ListenOverflows   • 소켓 버퍼 가득 → zero window(송신자 멈춤)</text>
  <text x="50" y="384" fill="#8b949e" font-size="12">• 데이터센터 안 네트워크 자체는 수십 µs — p99 를 키우는 건 대개 앱이 깨어나 실행되기까지의 스케줄링·GC·큐잉</text>
  <text x="50" y="406" fill="#58a6ff" font-size="12">관측: eBPF(XDP/TC/kprobe) 는 이 경로의 거의 모든 지점에 붙을 수 있다 → ebpf 주제</text>
</svg>
