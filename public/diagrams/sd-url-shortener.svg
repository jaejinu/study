<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="360" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">URL 단축기 — 읽기 경로는 캐시 계층, 쓰기 경로는 코드 생성</text>
  <g font-size="12">
    <rect x="24" y="70" width="110" height="50" rx="8" fill="#161b22" stroke="#30363d"/><text x="79" y="100" text-anchor="middle" fill="#e6edf3">브라우저</text>
    <rect x="160" y="70" width="110" height="50" rx="8" fill="#161b22" stroke="#22c55e"/><text x="215" y="92" text-anchor="middle" fill="#4ade80">CDN 엣지</text><text x="215" y="110" text-anchor="middle" fill="#8b949e" font-size="11">짧은 TTL</text>
    <rect x="296" y="70" width="110" height="50" rx="8" fill="#161b22" stroke="#30363d"/><text x="351" y="92" text-anchor="middle" fill="#e6edf3">API 서버</text><text x="351" y="110" text-anchor="middle" fill="#8b949e" font-size="11">메모리 LRU</text>
    <rect x="432" y="70" width="110" height="50" rx="8" fill="#161b22" stroke="#ef4444"/><text x="487" y="92" text-anchor="middle" fill="#f87171">Redis</text><text x="487" y="110" text-anchor="middle" fill="#8b949e" font-size="11">code → url</text>
    <rect x="568" y="70" width="120" height="50" rx="8" fill="#161b22" stroke="#3b82f6"/><text x="628" y="92" text-anchor="middle" fill="#60a5fa">DB 샤드</text><text x="628" y="110" text-anchor="middle" fill="#8b949e" font-size="11">code 기본 키</text>
  </g>
  <line x1="134" y1="95" x2="158" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="270" y1="95" x2="294" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="406" y1="95" x2="430" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="542" y1="95" x2="566" y2="95" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="554" y="86" text-anchor="middle" fill="#8b949e" font-size="10">미스</text>
  <rect x="712" y="56" width="224" height="140" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="824" y="80" text-anchor="middle" fill="#f59e0b" font-weight="600">캐시 크기별 적중률</text>
  <text x="824" y="98" text-anchor="middle" fill="#8b949e" font-size="11">(지프 분포 20만 요청, 링크 5만)</text>
  <g font-size="12" fill="#e6edf3">
    <text x="730" y="122">1%</text><rect x="770" y="111" width="67" height="14" fill="#3b82f6"/><text x="842" y="122">44.9%</text>
    <text x="730" y="144">5%</text><rect x="770" y="133" width="94" height="14" fill="#3b82f6"/><text x="869" y="144">62.5%</text>
    <text x="730" y="166">10%</text><rect x="770" y="155" width="105" height="14" fill="#3b82f6"/><text x="880" y="166">70.2%</text>
    <text x="730" y="188">50%</text><rect x="770" y="177" width="127" height="14" fill="#3b82f6"/><text x="902" y="188">85%</text>
  </g>
  <rect x="24" y="150" width="664" height="190" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="176" fill="#f59e0b" font-weight="600">코드 생성 — 카운터 vs 해시 (URL 5만 개)</text>
  <g font-size="12">
    <text x="44" y="202" fill="#e6edf3">카운터 + base62: 충돌 0 · 길이 최소 · 연속 코드(1001, 1002, 1003) → 추측 가능</text>
    <text x="44" y="226" fill="#e6edf3">SHA-256 앞 4자: 충돌 84 (생일 문제 기대값 84.6, 공간 1,480만)</text>
    <text x="44" y="248" fill="#e6edf3">SHA-256 앞 5자: 충돌 2 (기대 1.4) · 6자: 0</text>
    <text x="44" y="276" fill="#4ade80">권장: 서버별 카운터 블록(INCRBY 100만) + 순열로 섞기 → 충돌 없음 · 추측 어려움</text>
    <text x="44" y="300" fill="#8b949e">기대 충돌 ≈ n² / (2 · 62ᴸ) — 충돌은 n 이 아니라 n² 에 비례한다</text>
    <text x="44" y="324" fill="#8b949e" font-size="11">실험 sd-url-shortener · 클릭 통계는 리다이렉트 경로 밖에서 비동기(Kafka → ClickHouse)</text>
  </g>
</svg>
