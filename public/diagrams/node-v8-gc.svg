  <marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f85149"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">V8 — 실행 단계(티어)와 세대별 힙</text>

  <text x="40" y="62" fill="#58a6ff" font-weight="600">컴파일 파이프라인 (Node 22 · V8 12.4)</text>
  <rect x="40" y="74" width="140" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="110" y="98" text-anchor="middle" fill="#e6edf3" font-weight="600">파서</text>
  <text x="110" y="117" text-anchor="middle" fill="#8b949e" font-size="12">소스 → AST</text>
  <rect x="220" y="74" width="150" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="295" y="98" text-anchor="middle" fill="#58a6ff" font-weight="600">Ignition</text>
  <text x="295" y="117" text-anchor="middle" fill="#8b949e" font-size="12">바이트코드 인터프리터</text>
  <rect x="410" y="74" width="150" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="485" y="98" text-anchor="middle" fill="#58a6ff" font-weight="600">Sparkplug</text>
  <text x="485" y="117" text-anchor="middle" fill="#8b949e" font-size="12">빠른 베이스라인 JIT</text>
  <rect x="600" y="74" width="140" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="670" y="98" text-anchor="middle" fill="#8b949e" font-weight="600">Maglev</text>
  <text x="670" y="117" text-anchor="middle" fill="#8b949e" font-size="12">이 버전 기본 꺼짐</text>
  <rect x="780" y="74" width="140" height="56" rx="8" fill="#161b22" stroke="#3fb950"/>
  <text x="850" y="98" text-anchor="middle" fill="#3fb950" font-weight="600">TurboFan</text>
  <text x="850" y="117" text-anchor="middle" fill="#8b949e" font-size="12">최적화 JIT</text>
  <line x1="182" y1="102" x2="216" y2="102" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="372" y1="102" x2="406" y2="102" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="562" y1="102" x2="596" y2="102" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="742" y1="102" x2="776" y2="102" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M850,132 C850,168 295,168 295,136" fill="none" stroke="#f85149" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="572" y="184" text-anchor="middle" fill="#f85149" font-size="12">deopt — 가정(타입·hidden class)이 깨지면 바이트코드로 복귀 ("not a Smi")</text>

  <text x="40" y="206" fill="#3fb950" font-weight="600">힙 (세대 가설: 대부분의 객체는 금방 죽는다)</text>
  <rect x="40" y="214" width="300" height="110" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="190" y="236" text-anchor="middle" fill="#3fb950" font-weight="600">New space (young)</text>
  <rect x="60" y="248" width="120" height="40" rx="4" fill="#238636" fill-opacity="0.35" stroke="#3fb950"/>
  <text x="120" y="273" text-anchor="middle" fill="#e6edf3" font-size="12">from</text>
  <rect x="200" y="248" width="120" height="40" rx="4" fill="#0d1117" stroke="#3fb950" stroke-dasharray="4 3"/>
  <text x="260" y="273" text-anchor="middle" fill="#e6edf3" font-size="12">to</text>
  <text x="190" y="310" text-anchor="middle" fill="#8b949e" font-size="12">Scavenge: 살아남은 것만 복사 · 짧고 잦다</text>

  <rect x="420" y="214" width="320" height="110" rx="10" fill="#161b22" stroke="#d29922"/>
  <text x="580" y="236" text-anchor="middle" fill="#d29922" font-weight="600">Old space</text>
  <rect x="440" y="248" width="280" height="40" rx="4" fill="#9e6a03" fill-opacity="0.35" stroke="#d29922"/>
  <text x="580" y="273" text-anchor="middle" fill="#e6edf3" font-size="12">--max-old-space-size 로 상한</text>
  <text x="580" y="310" text-anchor="middle" fill="#8b949e" font-size="12">Mark-Compact: 증분·동시 마킹 · 드물고 비싸다</text>
  <line x1="342" y1="268" x2="416" y2="268" stroke="#d29922" stroke-width="1.5" marker-end="url(#o)"/>
  <text x="379" y="258" text-anchor="middle" fill="#d29922" font-size="11">2번 생존</text>
  <text x="379" y="284" text-anchor="middle" fill="#d29922" font-size="11">→ 승격</text>

  <rect x="780" y="214" width="140" height="110" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="850" y="236" text-anchor="middle" fill="#58a6ff" font-weight="600">힙 밖</text>
  <text x="850" y="262" text-anchor="middle" fill="#8b949e" font-size="12">Buffer ·</text>
  <text x="850" y="280" text-anchor="middle" fill="#8b949e" font-size="12">ArrayBuffer</text>
  <text x="850" y="306" text-anchor="middle" fill="#8b949e" font-size="12">(arrayBuffers)</text>

  <rect x="30" y="340" width="900" height="84" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="364" fill="#e6edf3">· 단명 객체 300만 개: minor 31회(5ms) · major 0회 / 1/3 유지: minor 46회(44ms) · major 2회 · old 137MB</text>
  <text x="50" y="388" fill="#f85149">· old space 상한 초과 → "JavaScript heap out of memory" · SIGABRT (종료 코드 134)</text>
  <text x="50" y="410" fill="#8b949e">· 컨테이너 한도 초과는 커널 OOM killer → SIGKILL (137) — 힙 상한은 한도의 70~75% 로</text>
</svg>
