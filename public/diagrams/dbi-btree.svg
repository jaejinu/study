<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="430" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">B+tree — 노드 하나 = 8KB 페이지 하나, 팬아웃 수백 → 높이 3~4</text>
  <rect x="380" y="54" width="200" height="44" rx="6" fill="#161b22" stroke="#8b5cf6"/>
  <text x="480" y="72" text-anchor="middle" fill="#8b5cf6" font-weight="600">루트 (블록 3)</text>
  <text x="480" y="90" text-anchor="middle" fill="#e6edf3" font-size="12">−∞ | 367 | 733 | 1099 | … (55개)</text>
  <g font-size="12">
    <rect x="60" y="150" width="190" height="60" rx="6" fill="#161b22" stroke="#3b82f6"/>
    <text x="155" y="170" text-anchor="middle" fill="#3b82f6">리프 (블록 1)</text>
    <text x="155" y="188" text-anchor="middle" fill="#e6edf3">high key 367</text>
    <text x="155" y="203" text-anchor="middle" fill="#8b949e" font-size="11">1→(0,1) 2→(0,2) … 366</text>
    <rect x="290" y="150" width="190" height="60" rx="6" fill="#161b22" stroke="#3b82f6"/>
    <text x="385" y="170" text-anchor="middle" fill="#3b82f6">리프 (블록 2)</text>
    <text x="385" y="188" text-anchor="middle" fill="#e6edf3">high key 733</text>
    <text x="385" y="203" text-anchor="middle" fill="#8b949e" font-size="11">367 … 732</text>
    <rect x="520" y="150" width="190" height="60" rx="6" fill="#161b22" stroke="#3b82f6"/>
    <text x="615" y="170" text-anchor="middle" fill="#3b82f6">리프 (블록 4)</text>
    <text x="615" y="188" text-anchor="middle" fill="#e6edf3">high key 1099</text>
    <text x="615" y="203" text-anchor="middle" fill="#8b949e" font-size="11">733 … 1098</text>
    <text x="780" y="186" fill="#8b949e">… 리프 55장</text>
  </g>
  <line x1="420" y1="98" x2="170" y2="148" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="460" y1="98" x2="390" y2="148" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="500" y1="98" x2="600" y2="148" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="250" y1="196" x2="288" y2="196" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="196" x2="518" y2="196" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="710" y1="196" x2="770" y2="196" stroke="#22c55e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="480" y="232" text-anchor="middle" fill="#22c55e" font-size="11">형제 연결 (범위 스캔 · B-link: 분할 중에도 오른쪽으로 따라감)</text>
  <!-- heap -->
  <rect x="60" y="250" width="380" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="250" y="275" text-anchor="middle" fill="#8b949e" font-size="12">힙 페이지 0, 1, 2 …  리프의 ctid (페이지, 슬롯) 가 가리키는 곳</text>
  <line x1="120" y1="210" x2="120" y2="248" stroke="#8b949e" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <!-- split comparison -->
  <rect x="60" y="306" width="840" height="110" rx="10" fill="#161b22" stroke="#f59e0b"/>
  <text x="480" y="330" text-anchor="middle" fill="#f59e0b" font-weight="600">같은 20,000 키 — 삽입 순서가 페이지 모양을 바꾼다 (실험 dbi-btree-pageinspect)</text>
  <text x="90" y="356" fill="#e6edf3">순차 키 (bigserial · UUID v7)</text>
  <rect x="330" y="344" width="403" height="14" fill="#3b82f6"/><text x="745" y="356" fill="#e6edf3">리프 55 · 채움 90%</text>
  <text x="90" y="380" fill="#e6edf3">무작위 키 (UUID v4)</text>
  <rect x="330" y="368" width="322" height="14" fill="#f59e0b"/><text x="664" y="380" fill="#e6edf3">리프 69 · 채움 72% (중간 분할)</text>
  <text x="90" y="404" fill="#e6edf3">순차 + fillfactor 50</text>
  <rect x="330" y="392" width="228" height="14" fill="#8b5cf6"/><text x="570" y="404" fill="#e6edf3">리프 98 · 채움 51% (나중 갱신용 여유)</text>
</svg>
