<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="380" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">count++ 는 세 단계다 — 끼어들면 갱신 하나가 사라진다</text>
  <text x="170" y="65" text-anchor="middle" fill="#3b82f6" font-weight="600">스레드 A</text>
  <text x="480" y="65" text-anchor="middle" fill="#f59e0b" font-weight="600">스레드 B</text>
  <text x="800" y="65" text-anchor="middle" fill="#8b949e" font-weight="600">메모리 count</text>
  <g font-family="ui-monospace, monospace" font-size="13">
    <rect x="70" y="80" width="200" height="34" rx="6" fill="#161b22" stroke="#3b82f6"/><text x="170" y="102" text-anchor="middle" fill="#e6edf3">read → 7</text>
    <rect x="380" y="124" width="200" height="34" rx="6" fill="#161b22" stroke="#f59e0b"/><text x="480" y="146" text-anchor="middle" fill="#e6edf3">read → 7</text>
    <rect x="70" y="168" width="200" height="34" rx="6" fill="#161b22" stroke="#3b82f6"/><text x="170" y="190" text-anchor="middle" fill="#e6edf3">7 + 1 = 8</text>
    <rect x="380" y="212" width="200" height="34" rx="6" fill="#161b22" stroke="#f59e0b"/><text x="480" y="234" text-anchor="middle" fill="#e6edf3">7 + 1 = 8</text>
    <rect x="70" y="256" width="200" height="34" rx="6" fill="#161b22" stroke="#3b82f6"/><text x="170" y="278" text-anchor="middle" fill="#e6edf3">write ← 8</text>
    <rect x="380" y="300" width="200" height="34" rx="6" fill="#161b22" stroke="#f59e0b"/><text x="480" y="322" text-anchor="middle" fill="#e6edf3">write ← 8</text>
    <text x="800" y="102" text-anchor="middle" fill="#e6edf3">7</text>
    <text x="800" y="146" text-anchor="middle" fill="#e6edf3">7</text>
    <text x="800" y="190" text-anchor="middle" fill="#e6edf3">7</text>
    <text x="800" y="234" text-anchor="middle" fill="#e6edf3">7</text>
    <text x="800" y="278" text-anchor="middle" fill="#e6edf3">8</text>
    <text x="800" y="322" text-anchor="middle" fill="#ef4444" font-weight="600">8  (9 여야 함)</text>
  </g>
  <line x1="660" y1="80" x2="660" y2="340" stroke="#30363d"/>
  <text x="30" y="365" fill="#8b949e" font-size="12">해법: 읽기-수정-쓰기를 한 단계로 — Atomics.add · lock xadd · Redis INCR · UPDATE … SET n = n + 1 · 락으로 감싸기</text>
</svg>
