<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="470" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Nginx 가 요청 하나를 처리하는 순서 — 단계(phase) · 캐시 · 업스트림</text>
  <!-- client -->
  <rect x="20" y="80" width="100" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="70" y="106" text-anchor="middle" fill="#e6edf3" font-weight="600">클라이언트</text>
  <text x="70" y="124" text-anchor="middle" fill="#8b949e" font-size="11">GET /api/x</text>
  <line x1="120" y1="110" x2="146" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <!-- phases -->
  <g>
    <rect x="148" y="70" width="110" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="203" y="94" text-anchor="middle" fill="#e6edf3" font-weight="600">server 선택</text>
    <text x="203" y="113" text-anchor="middle" fill="#8b949e" font-size="11">listen + server_name</text>
    <text x="203" y="129" text-anchor="middle" fill="#8b949e" font-size="11">→ location 매칭</text>
    <line x1="258" y1="110" x2="276" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

    <rect x="278" y="70" width="120" height="80" rx="8" fill="#161b22" stroke="#f59e0b"/>
    <text x="338" y="94" text-anchor="middle" fill="#f59e0b" font-weight="600">rewrite</text>
    <text x="338" y="113" text-anchor="middle" fill="#8b949e" font-size="11">rewrite · set</text>
    <text x="338" y="129" text-anchor="middle" fill="#f59e0b" font-size="11">return → 여기서 끝</text>
    <line x1="398" y1="110" x2="416" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

    <rect x="418" y="70" width="120" height="80" rx="8" fill="#161b22" stroke="#ff4438"/>
    <text x="478" y="94" text-anchor="middle" fill="#ff4438" font-weight="600">preaccess</text>
    <text x="478" y="113" text-anchor="middle" fill="#e6edf3" font-size="11">limit_req (503)</text>
    <text x="478" y="129" text-anchor="middle" fill="#8b949e" font-size="11">limit_conn</text>
    <line x1="538" y1="110" x2="556" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

    <rect x="558" y="70" width="110" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="613" y="94" text-anchor="middle" fill="#e6edf3" font-weight="600">access</text>
    <text x="613" y="113" text-anchor="middle" fill="#8b949e" font-size="11">allow · deny</text>
    <text x="613" y="129" text-anchor="middle" fill="#8b949e" font-size="11">auth_request</text>
    <line x1="668" y1="110" x2="686" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

    <rect x="688" y="70" width="120" height="80" rx="8" fill="#161b22" stroke="#3b82f6"/>
    <text x="748" y="94" text-anchor="middle" fill="#3b82f6" font-weight="600">content</text>
    <text x="748" y="113" text-anchor="middle" fill="#e6edf3" font-size="11">proxy_pass</text>
    <text x="748" y="129" text-anchor="middle" fill="#8b949e" font-size="11">정적 파일 · fastcgi</text>
    <line x1="808" y1="110" x2="826" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

    <rect x="828" y="70" width="110" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="883" y="94" text-anchor="middle" fill="#e6edf3" font-weight="600">log</text>
    <text x="883" y="113" text-anchor="middle" fill="#8b949e" font-size="11">access_log</text>
    <text x="883" y="129" text-anchor="middle" fill="#8b949e" font-size="11">$request_time</text>
  </g>
  <!-- return trap -->
  <rect x="278" y="166" width="260" height="46" rx="6" fill="#2a1f0b" stroke="#f59e0b"/>
  <text x="408" y="186" text-anchor="middle" fill="#f59e0b" font-size="12">함정 — return 200 과 limit_req 를 한 location 에 두면</text>
  <text x="408" y="203" text-anchor="middle" fill="#e6edf3" font-size="12">rewrite 에서 끝나 limit_req 가 돌지 않는다 (실험: 30/30 통과)</text>
  <!-- cache + upstream -->
  <line x1="748" y1="150" x2="748" y2="238" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="610" y="240" width="276" height="96" rx="8" fill="#161b22" stroke="#22c55e"/>
  <text x="748" y="262" text-anchor="middle" fill="#22c55e" font-weight="600">proxy_cache (키 = $scheme$host$request_uri)</text>
  <text x="626" y="284" fill="#e6edf3" font-size="12">HIT → 디스크/메모리에서 바로 응답 (1ms)</text>
  <text x="626" y="303" fill="#e6edf3" font-size="12">MISS → 원본으로 (300ms) 후 저장</text>
  <text x="626" y="322" fill="#8b949e" font-size="12">cache_lock: 동시 미스 20 → 원본 1번</text>
  <line x1="748" y1="336" x2="748" y2="368" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="540" y="370" width="410" height="84" rx="8" fill="#161b22" stroke="#8b5cf6"/>
  <text x="745" y="392" text-anchor="middle" fill="#8b5cf6" font-weight="600">upstream app (라운드 로빈)</text>
  <rect x="556" y="404" width="120" height="36" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="616" y="427" text-anchor="middle" fill="#e6edf3" font-size="12">A  max_fails=1</text>
  <rect x="690" y="404" width="120" height="36" rx="6" fill="#0d1117" stroke="#ff4438" stroke-dasharray="4 3"/>
  <text x="750" y="427" text-anchor="middle" fill="#ff4438" font-size="12">B  (정지)</text>
  <text x="822" y="418" fill="#8b949e" font-size="11">connect 1s 실패 →</text>
  <text x="822" y="434" fill="#8b949e" font-size="11">next_upstream → A</text>
  <!-- legend left -->
  <rect x="20" y="240" width="500" height="214" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="264" fill="#e6edf3" font-weight="600">실측 (이 사이트 nginx 실험실)</text>
  <text x="36" y="290" fill="#e6edf3" font-size="12">• rate=5r/s 동시 30요청: burst 없음 1개 · burst 10 nodelay 11개(즉시)</text>
  <text x="36" y="310" fill="#e6edf3" font-size="12">  · burst 10 delay 11개(마지막 2.0초 대기) — 나머지는 503</text>
  <text x="36" y="334" fill="#e6edf3" font-size="12">• 캐시: MISS 307ms → HIT 1ms, 원본 호출 1회</text>
  <text x="36" y="358" fill="#e6edf3" font-size="12">• B 정지 + 재시도: 10/10 성공, 느린 요청 1개(1.0s)</text>
  <text x="36" y="378" fill="#e6edf3" font-size="12">  B 정지 + 재시도 끔 + max_fails=0: 5/10 실패, 각 1.0s</text>
  <text x="36" y="404" fill="#8b949e" font-size="12">단계 순서가 곧 정책 순서다: 레이트리밋이 인증보다 앞(preaccess)에 있어</text>
  <text x="36" y="422" fill="#8b949e" font-size="12">로그인 시도 폭주도 인증 처리 전에 깎인다.</text>
  <text x="36" y="444" fill="#8b949e" font-size="11">실험: nginx-rate-limit-burst · nginx-proxy-cache · nginx-upstream-failover</text>
</svg>
