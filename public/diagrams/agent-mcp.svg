<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="420" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">MCP — 모델은 MCP 를 모른다, 호스트가 번역한다</text>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <!-- model -->
  <rect x="30" y="80" width="170" height="120" rx="10" fill="#161b22" stroke="#3b82f6"/>
  <text x="115" y="106" text-anchor="middle" fill="#60a5fa" font-weight="600">LLM</text>
  <text x="115" y="130" text-anchor="middle" fill="#8b949e" font-size="12">tools: [function …]</text>
  <text x="115" y="150" text-anchor="middle" fill="#8b949e" font-size="12">→ tool_call</text>
  <text x="115" y="176" text-anchor="middle" fill="#8b949e" font-size="11">(OpenAI · Claude · Ollama)</text>
  <!-- host -->
  <rect x="250" y="60" width="300" height="290" rx="12" fill="#161b22" stroke="#7c3aed"/>
  <text x="400" y="86" text-anchor="middle" fill="#a78bfa" font-weight="600">호스트 (앱)</text>
  <rect x="270" y="100" width="260" height="56" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="400" y="122" text-anchor="middle" fill="#e6edf3">번역기</text>
  <text x="400" y="142" text-anchor="middle" fill="#8b949e" font-size="11">MCP tool ↔ function 스키마 · tool_call ↔ tools/call</text>
  <rect x="270" y="168" width="260" height="44" rx="8" fill="#0d1117" stroke="#22c55e"/>
  <text x="400" y="195" text-anchor="middle" fill="#22c55e">사용자 동의 · 허용 목록 · 네임스페이스</text>
  <rect x="270" y="224" width="120" height="110" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="330" y="246" text-anchor="middle" fill="#e6edf3">클라이언트 A</text>
  <text x="330" y="266" text-anchor="middle" fill="#8b949e" font-size="11">1:1 세션</text>
  <text x="330" y="284" text-anchor="middle" fill="#8b949e" font-size="11">initialize</text>
  <text x="330" y="300" text-anchor="middle" fill="#8b949e" font-size="11">tools/list</text>
  <text x="330" y="316" text-anchor="middle" fill="#8b949e" font-size="11">tools/call</text>
  <rect x="410" y="224" width="120" height="110" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="470" y="246" text-anchor="middle" fill="#e6edf3">클라이언트 B</text>
  <text x="470" y="266" text-anchor="middle" fill="#8b949e" font-size="11">1:1 세션</text>
  <text x="470" y="284" text-anchor="middle" fill="#8b949e" font-size="11">resources/read</text>
  <text x="470" y="300" text-anchor="middle" fill="#8b949e" font-size="11">prompts/get</text>
  <!-- servers -->
  <rect x="640" y="70" width="290" height="130" rx="10" fill="#161b22" stroke="#f59e0b"/>
  <text x="785" y="95" text-anchor="middle" fill="#f59e0b" font-weight="600">MCP 서버: study-notes (stdio)</text>
  <text x="785" y="120" text-anchor="middle" fill="#e6edf3" font-size="12">Tools: search_notes · get_note · list_experiments</text>
  <text x="785" y="142" text-anchor="middle" fill="#8b949e" font-size="12">Resources: note://kafka/08-… (제안)</text>
  <text x="785" y="164" text-anchor="middle" fill="#8b949e" font-size="12">Prompts: "이 노트를 3줄 요약"</text>
  <text x="785" y="186" text-anchor="middle" fill="#8b949e" font-size="11">실행기는 사이트의 executeTool 그대로</text>
  <rect x="640" y="225" width="290" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="785" y="250" text-anchor="middle" fill="#e6edf3" font-weight="600">MCP 서버: 원격 (Streamable HTTP)</text>
  <text x="785" y="274" text-anchor="middle" fill="#8b949e" font-size="12">POST /mcp · SSE 응답 · Mcp-Session-Id</text>
  <text x="785" y="296" text-anchor="middle" fill="#8b949e" font-size="12">OAuth 로 사용자 권한</text>
  <text x="785" y="318" text-anchor="middle" fill="#ef4444" font-size="11">툴 설명·결과 = 신뢰할 수 없는 입력</text>
  <!-- arrows -->
  <line x1="202" y1="125" x2="268" y2="125" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="268" y1="150" x2="202" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="390" y1="280" x2="638" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="520" y="200" text-anchor="middle" fill="#8b949e" font-size="11">JSON-RPC 2.0</text>
  <line x1="532" y1="285" x2="638" y2="285" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <!-- bottom -->
  <rect x="30" y="365" width="900" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="390" text-anchor="middle" fill="#e6edf3" font-size="12">실험 기록: initialize(157B) → result → notifications/initialized → tools/list(46B) → result(1,673B) → tools/call(123B) → result(1,122B)</text>
</svg>
