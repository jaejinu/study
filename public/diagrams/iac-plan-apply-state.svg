<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Terraform/OpenTofu — 세 가지 상태와 plan/apply 루프</text>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <rect x="40" y="70" width="240" height="90" rx="10" fill="#161b22" stroke="#3b82f6"/>
  <text x="160" y="95" text-anchor="middle" fill="#3b82f6" font-weight="600">코드 (.tf, HCL)</text>
  <text x="160" y="118" text-anchor="middle" fill="#e6edf3">"바라는 상태"</text>
  <text x="160" y="140" text-anchor="middle" fill="#8b949e" font-size="11">git · PR 리뷰 · 정책 검사</text>
  <rect x="360" y="70" width="240" height="90" rx="10" fill="#161b22" stroke="#f59e0b"/>
  <text x="480" y="95" text-anchor="middle" fill="#f59e0b" font-weight="600">state (tfstate)</text>
  <text x="480" y="118" text-anchor="middle" fill="#e6edf3">"마지막으로 안 상태"</text>
  <text x="480" y="140" text-anchor="middle" fill="#8b949e" font-size="11">주소 ↔ 실제 ID · 비밀 포함 · 원격+잠금+암호화</text>
  <rect x="680" y="70" width="240" height="90" rx="10" fill="#161b22" stroke="#22c55e"/>
  <text x="800" y="95" text-anchor="middle" fill="#22c55e" font-weight="600">실제 인프라</text>
  <text x="800" y="118" text-anchor="middle" fill="#e6edf3">"현재 상태"</text>
  <text x="800" y="140" text-anchor="middle" fill="#8b949e" font-size="11">Docker · k8s · 클라우드 API</text>
  <line x1="680" y1="115" x2="602" y2="115" stroke="#22c55e" stroke-width="2" marker-end="url(#a)"/>
  <text x="640" y="105" text-anchor="middle" fill="#22c55e" font-size="11">refresh (read)</text>
  <rect x="300" y="210" width="360" height="60" rx="10" fill="#161b22" stroke="#8b5cf6"/>
  <text x="480" y="235" text-anchor="middle" fill="#8b5cf6" font-weight="600">plan = diff(코드, refresh 된 state)</text>
  <text x="480" y="256" text-anchor="middle" fill="#e6edf3" font-size="12">+ 생성   ~ 제자리 수정   -/+ 교체(주의!)   - 삭제</text>
  <line x1="160" y1="160" x2="330" y2="208" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="160" x2="480" y2="208" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="310" width="360" height="50" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="332" text-anchor="middle" fill="#e6edf3" font-weight="600">apply</text>
  <text x="480" y="350" text-anchor="middle" fill="#8b949e" font-size="11">프로바이더 API create/update/delete → state 갱신 (serial+1)</text>
  <line x1="480" y1="270" x2="480" y2="308" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <path d="M660 335 C 760 335, 800 250, 800 162" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#a)"/>
  <path d="M300 335 C 200 335, 480 200, 480 162" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)" opacity="0.7"/>
  <text x="120" y="300" fill="#8b949e" font-size="11">같은 코드 두 번째 plan → No changes (멱등)</text>
  <text x="120" y="318" fill="#8b949e" font-size="11">코드 밖 변경 → refresh 가 알아챔 → 드리프트</text>
  <text x="120" y="336" fill="#8b949e" font-size="11">ForceNew 속성 변경 → must be replaced</text>
  <text x="480" y="388" text-anchor="middle" fill="#8b949e" font-size="11">실험: iac-plan-apply-docker · iac-drift-detect · iac-state-import</text>
</svg>
