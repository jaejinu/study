<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="440" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">분석기 파이프라인 → 역색인 — 같은 분석기가 색인과 질의 양쪽을 거친다</text>
  <!-- input -->
  <rect x="30" y="60" width="260" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="160" y="83" text-anchor="middle" fill="#8b949e" font-size="12">문서 원문</text>
  <text x="160" y="103" text-anchor="middle" fill="#e6edf3">"복제본의 지연을 모니터링한다"</text>
  <!-- pipeline -->
  <rect x="30" y="140" width="260" height="44" rx="8" fill="#161b22" stroke="#3b82f6"/>
  <text x="160" y="160" text-anchor="middle" fill="#3b82f6" font-weight="600">① 문자 필터</text>
  <text x="160" y="176" text-anchor="middle" fill="#8b949e" font-size="11">html_strip · mapping</text>
  <rect x="30" y="196" width="260" height="56" rx="8" fill="#161b22" stroke="#3b82f6"/>
  <text x="160" y="216" text-anchor="middle" fill="#3b82f6" font-weight="600">② 토크나이저 (nori + 사용자 사전)</text>
  <text x="160" y="236" text-anchor="middle" fill="#e6edf3" font-size="12">복제본 · 복제 · 본 · 의 · 지연 · 을 · 모니터링 · 하 · ㄴ다</text>
  <rect x="30" y="264" width="260" height="56" rx="8" fill="#161b22" stroke="#3b82f6"/>
  <text x="160" y="284" text-anchor="middle" fill="#3b82f6" font-weight="600">③ 토큰 필터</text>
  <text x="160" y="303" text-anchor="middle" fill="#8b949e" font-size="11">lowercase · 품사 제거(조사 J · 어미 E)</text>
  <rect x="30" y="332" width="260" height="44" rx="8" fill="#161b22" stroke="#22c55e"/>
  <text x="160" y="359" text-anchor="middle" fill="#22c55e">복제본 · 복제 · 본 · 지연 · 모니터링</text>
  <line x1="160" y1="116" x2="160" y2="138" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="160" y1="184" x2="160" y2="194" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="160" y1="252" x2="160" y2="262" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="160" y1="320" x2="160" y2="330" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <!-- inverted index -->
  <line x1="292" y1="354" x2="370" y2="230" stroke="#22c55e" stroke-width="2" marker-end="url(#a)"/>
  <text x="350" y="310" fill="#22c55e" font-size="11">색인</text>
  <rect x="372" y="60" width="330" height="320" rx="10" fill="#161b22" stroke="#8b5cf6"/>
  <text x="537" y="84" text-anchor="middle" fill="#8b5cf6" font-weight="600">역색인 (세그먼트 하나)</text>
  <text x="392" y="110" fill="#8b949e" font-size="11">텀 사전 (FST)</text>
  <text x="540" y="110" fill="#8b949e" font-size="11">포스팅: 문서ID (tf, 위치)</text>
  <g font-size="12">
    <text x="392" y="138" fill="#e6edf3">모니터링</text><text x="540" y="138" fill="#e6edf3">3(1,[4]) · 41(2,..) · 88</text>
    <text x="392" y="164" fill="#e6edf3">복제</text><text x="540" y="164" fill="#e6edf3">3(5,..) · 12 · 41 · 57 · 90 …</text>
    <text x="392" y="190" fill="#e6edf3">복제본</text><text x="540" y="190" fill="#e6edf3">3 · 57</text>
    <text x="392" y="216" fill="#e6edf3">지연</text><text x="540" y="216" fill="#e6edf3">3 · 8 · 41 · 66 · 90 …</text>
    <text x="392" y="242" fill="#e6edf3">파이프라인</text><text x="540" y="242" fill="#e6edf3">9 · 14 · 72</text>
  </g>
  <line x1="392" y1="258" x2="682" y2="258" stroke="#30363d"/>
  <text x="392" y="280" fill="#8b949e" font-size="11">+ doc values (keyword·숫자 열 저장 → 집계·정렬)</text>
  <text x="392" y="300" fill="#8b949e" font-size="11">+ 노름 (문서 길이 → BM25 길이 보정)</text>
  <text x="392" y="320" fill="#8b949e" font-size="11">+ .liv 비트맵 (삭제 표시, 머지 때 제거)</text>
  <text x="392" y="350" fill="#f59e0b" font-size="11">세그먼트는 불변 · refresh 로 생기고 · 머지로 합쳐진다 (LSM 과 같은 구조)</text>
  <!-- query -->
  <rect x="740" y="60" width="200" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="840" y="83" text-anchor="middle" fill="#8b949e" font-size="12">질의</text>
  <text x="840" y="103" text-anchor="middle" fill="#e6edf3">"복제 지연"</text>
  <rect x="740" y="140" width="200" height="44" rx="8" fill="#161b22" stroke="#3b82f6"/>
  <text x="840" y="167" text-anchor="middle" fill="#3b82f6">같은 분석기 → 복제 · 지연</text>
  <line x1="840" y1="116" x2="840" y2="138" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="740" y1="168" x2="704" y2="178" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="740" y="210" width="200" height="110" rx="8" fill="#161b22" stroke="#f59e0b"/>
  <text x="840" y="232" text-anchor="middle" fill="#f59e0b" font-weight="600">포스팅 병합 + BM25</text>
  <text x="754" y="256" fill="#e6edf3" font-size="12">doc 3: 복제 + 지연 → 2.85</text>
  <text x="754" y="276" fill="#e6edf3" font-size="12">doc 41: 복제 + 지연 → 2.31</text>
  <text x="754" y="296" fill="#e6edf3" font-size="12">doc 12: 복제만 → 1.10</text>
  <line x1="704" y1="200" x2="740" y2="240" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="396" width="910" height="32" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="485" y="417" text-anchor="middle" fill="#8b949e" font-size="12">standard 분석기라면 "복제본의 · 지연을 · 모니터링한다" 가 토큰 → 질의 "복제" 와 안 맞는다 (실측: 65건 vs nori 88건) · 실험 search-index-notes</text>
</svg>
