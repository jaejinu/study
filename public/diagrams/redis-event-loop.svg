<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="ui-sans-serif, system-ui, 'Apple SD Gothic Neo', sans-serif" font-size="12.5">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8b98a9"/></marker></defs>
  <rect width="900" height="320" fill="#0d1117"/>
  <text x="30" y="32" fill="#e6edf3" font-weight="600" font-size="15">Redis 의 단일 스레드 이벤트 루프 — 명령은 한 줄로 선다</text>
  <g fill="#1a222e" stroke="#243040"><rect x="30" y="70" width="110" height="40" rx="8"/><rect x="30" y="120" width="110" height="40" rx="8"/><rect x="30" y="170" width="110" height="40" rx="8"/></g>
  <g fill="#e6edf3"><text x="44" y="95">클라이언트 A</text><text x="44" y="145">클라이언트 B</text><text x="44" y="195">클라이언트 C</text></g>
  <g fill="#8b98a9" font-size="11"><text x="150" y="88">INCR views</text><text x="150" y="138">GET user:1</text><text x="150" y="188">KEYS *  (O(N)!)</text></g>
  <rect x="250" y="60" width="150" height="160" rx="10" fill="#121821" stroke="#58a6ff"/>
  <text x="266" y="84" fill="#58a6ff" font-weight="600">I/O (epoll)</text>
  <g fill="#8b98a9" font-size="11"><text x="266" y="106">소켓 감시</text><text x="266" y="122">읽기·RESP 파싱</text><text x="266" y="138">(I/O 스레드 가능)</text><text x="266" y="170">응답 쓰기</text></g>
  <rect x="440" y="60" width="200" height="160" rx="10" fill="#121821" stroke="#ff4438" stroke-width="1.5"/>
  <text x="456" y="84" fill="#ff4438" font-weight="600">실행 (메인 스레드 하나)</text>
  <g fill="#1a222e" stroke="#243040"><rect x="456" y="96" width="168" height="24" rx="5"/><rect x="456" y="126" width="168" height="24" rx="5"/><rect x="456" y="156" width="168" height="24" rx="5"/></g>
  <g fill="#e6edf3" font-size="11.5"><text x="464" y="112">1. INCR views  → 원자적</text><text x="464" y="142">2. GET user:1</text><text x="464" y="172">3. KEYS * → 모두 대기 ✗</text></g>
  <text x="456" y="205" fill="#8b98a9" font-size="11">순차 실행 = 원자성 + 느린 명령 = 전체 정지</text>
  <rect x="680" y="60" width="190" height="160" rx="10" fill="#121821" stroke="#243040"/>
  <text x="696" y="84" fill="#e6edf3" font-weight="600">serverCron (hz=10)</text>
  <g fill="#8b98a9" font-size="11"><text x="696" y="108">만료 키 샘플링 삭제</text><text x="696" y="126">점진적 리해싱 1ms</text><text x="696" y="144">축출(maxmemory)</text><text x="696" y="162">AOF 버퍼 flush</text><text x="696" y="180">통계·클라이언트 타임아웃</text></g>
  <g fill="none" stroke="#8b98a9" marker-end="url(#a)"><path d="M140 90 H248"/><path d="M140 140 H248"/><path d="M140 190 H248"/><path d="M400 140 H438"/><path d="M640 140 H678"/></g>
  <text x="30" y="262" fill="#8b98a9" font-size="12">파이프라인은 I/O 단계에서 여러 명령을 한 번에 읽고 쓰므로 RTT 를 줄인다. MULTI/EXEC 는 실행 단계에서 명령 묶음 사이에 다른 클라이언트가 끼지 못하게 한다.</text>
  <text x="30" y="284" fill="#8b98a9" font-size="12">관찰: INFO stats (ops/sec), SLOWLOG GET, LATENCY LATEST, CLIENT LIST 의 qbuf/omem.</text>
</svg>
