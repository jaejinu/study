<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="ui-sans-serif, system-ui, 'Apple SD Gothic Neo', sans-serif" font-size="12.5">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8b98a9"/></marker></defs>
  <rect width="900" height="300" fill="#0d1117"/>
  <text x="30" y="32" fill="#e6edf3" font-weight="600" font-size="15">Outbox 패턴 — 이중 쓰기 문제를 한 트랜잭션으로</text>
  <text x="30" y="70" fill="#ff4438" font-weight="600">✗ 이중 쓰기</text>
  <g fill="#1a222e" stroke="#243040"><rect x="130" y="52" width="110" height="36" rx="6"/><rect x="290" y="52" width="130" height="36" rx="6"/><rect x="470" y="52" width="130" height="36" rx="6"/></g>
  <g fill="#e6edf3"><text x="142" y="75">주문 서비스</text><text x="302" y="75">DB INSERT ✓</text><text x="482" y="75">Kafka 발행 ✗</text></g>
  <g fill="none" stroke="#8b98a9" marker-end="url(#a)"><path d="M240 70 H288"/><path d="M420 70 H468"/></g>
  <text x="620" y="75" fill="#8b98a9" font-size="11.5">← 여기서 죽으면 주문은 있는데 이벤트가 없다</text>
  <text x="30" y="150" fill="#3fb950" font-weight="600">✓ Outbox</text>
  <rect x="130" y="120" width="330" height="70" rx="8" fill="#121821" stroke="#336791" stroke-width="1.5"/>
  <text x="142" y="140" fill="#58a6ff" font-weight="600" font-size="11.5">PostgreSQL 트랜잭션 (원자적)</text>
  <g fill="#1a222e" stroke="#243040"><rect x="142" y="150" width="140" height="30" rx="6"/><rect x="300" y="150" width="148" height="30" rx="6"/></g>
  <g fill="#e6edf3" font-size="12"><text x="152" y="170">INSERT orders</text><text x="310" y="170">INSERT outbox</text></g>
  <g fill="#1a222e" stroke="#243040"><rect x="500" y="137" width="110" height="36" rx="6"/><rect x="650" y="137" width="110" height="36" rx="6"/><rect x="790" y="137" width="80" height="36" rx="6"/></g>
  <g fill="#e6edf3" font-size="12"><text x="512" y="160">릴레이/CDC</text><text x="662" y="160">Kafka 토픽</text><text x="802" y="160">소비자</text></g>
  <g fill="none" stroke="#8b98a9" marker-end="url(#a)"><path d="M460 155 H498"/><path d="M610 155 H648"/><path d="M760 155 H788"/></g>
  <g fill="#8b98a9" font-size="11">
    <text x="500" y="195">SKIP LOCKED 로 미발행 행 집기</text><text x="500" y="210">발행 후 published=true</text>
    <text x="650" y="195">at-least-once</text><text x="650" y="210">(릴레이가 죽으면 재발행 → 중복)</text>
    <text x="790" y="195">멱등 처리</text><text x="790" y="210">processed_events</text>
  </g>
  <text x="30" y="262" fill="#8b98a9" font-size="11.5">Debezium(CDC) 은 outbox 테이블을 폴링하지 않고 WAL 을 읽어 스트리밍한다. 유실 없음 + 중복 가능 → 소비자는 반드시 멱등.</text>
</svg>
