<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="380" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">포화 곡선 — 사용률이 오르면 대기 시간은 비선형으로 는다 (M/M/1: W = ρ/(1−ρ) × S)</text>
  <!-- axes -->
  <line x1="80" y1="320" x2="600" y2="320" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="80" y1="320" x2="80" y2="60" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="600" y="345" text-anchor="end" fill="#8b949e" font-size="12">사용률 ρ = 도착률 / 서비스율</text>
  <text x="60" y="70" text-anchor="end" fill="#8b949e" font-size="12">지연</text>
  <!-- curve: y = 320 - k * rho/(1-rho), rho from 0..0.97 -->
  <path d="M80,315 L130,312 L180,308 L230,303 L280,296 L330,286 L380,272 L420,255 L450,236 L480,208 L500,180 L520,145 L535,110 L545,80 L552,62" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <!-- markers -->
  <g font-size="11" fill="#8b949e">
    <line x1="340" y1="320" x2="340" y2="283" stroke="#30363d" stroke-dasharray="3 3"/><text x="340" y="335" text-anchor="middle">50%</text><text x="340" y="275" text-anchor="middle" fill="#e6edf3">1×S</text>
    <line x1="496" y1="320" x2="496" y2="190" stroke="#30363d" stroke-dasharray="3 3"/><text x="496" y="335" text-anchor="middle">80%</text><text x="470" y="185" text-anchor="middle" fill="#e6edf3">4×S</text>
    <line x1="548" y1="320" x2="548" y2="75" stroke="#30363d" stroke-dasharray="3 3"/><text x="548" y="335" text-anchor="middle">90%</text><text x="520" y="100" text-anchor="middle" fill="#e6edf3">9×S</text>
    <text x="80" y="335" text-anchor="middle">0</text><text x="590" y="335" text-anchor="middle">100%</text>
  </g>
  <rect x="470" y="60" width="4" height="260" fill="#ef4444" opacity="0.25"/>
  <text x="490" y="68" fill="#ef4444" font-size="11">절벽 구간</text>
  <!-- measured table -->
  <rect x="630" y="60" width="310" height="270" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="785" y="85" text-anchor="middle" fill="#3b82f6" font-weight="600">실측 (perf-k6-arrival-rate, 개발 서버)</text>
  <g font-size="12">
    <text x="650" y="115" fill="#8b949e">목표 req/s</text><text x="740" y="115" fill="#8b949e">실제</text><text x="800" y="115" fill="#8b949e">p50</text><text x="860" y="115" fill="#8b949e">p99</text>
    <line x1="645" y1="122" x2="925" y2="122" stroke="#30363d"/>
    <text x="650" y="145" fill="#e6edf3">10</text><text x="740" y="145" fill="#e6edf3">10.1</text><text x="800" y="145" fill="#e6edf3">30ms</text><text x="860" y="145" fill="#e6edf3">37ms</text>
    <text x="650" y="172" fill="#e6edf3">25</text><text x="740" y="172" fill="#e6edf3">25.0</text><text x="800" y="172" fill="#e6edf3">26ms</text><text x="860" y="172" fill="#f59e0b">63ms</text>
    <text x="650" y="199" fill="#e6edf3">50</text><text x="740" y="199" fill="#ef4444">36.8</text><text x="800" y="199" fill="#ef4444">1012ms</text><text x="860" y="199" fill="#ef4444">1720ms</text>
  </g>
  <text x="650" y="235" fill="#8b949e" font-size="11">서비스 시간 S ≈ 27ms → 단일 워커 상한 ≈ 37 req/s</text>
  <text x="650" y="255" fill="#8b949e" font-size="11">25 req/s = ρ ≈ 0.68: p50 그대로, p99 먼저 벌어짐</text>
  <text x="650" y="275" fill="#8b949e" font-size="11">50 req/s = ρ &gt; 1: 큐 발산, 요청 드롭 45건</text>
  <text x="650" y="305" fill="#f59e0b" font-size="11">리틀의 법칙: 동시성 L = λ × W ≈ 36.8 × 1.0s ≈ 37</text>
  <text x="80" y="365" fill="#8b949e" font-size="11">CPU 80% 알림, 큐 깊이 모니터링, 헤드룸 30% 의 근거가 이 곡선이다. 변동(burst)이 크면 더 낮은 사용률에서 절벽이 온다.</text>
</svg>
