<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="ui-sans-serif, system-ui, 'Apple SD Gothic Neo', sans-serif" font-size="12.5">
  <rect width="900" height="330" fill="#0d1117"/>
  <text x="30" y="32" fill="#e6edf3" font-weight="600" font-size="15">MVCC — UPDATE 는 덮어쓰지 않고 새 버전을 만든다 (실험 "pg-transaction-isolation")</text>
  <text x="30" y="70" fill="#8b98a9" font-size="12">힙 페이지 안의 튜플들 (xmin = 만든 xid, xmax = 지운/갱신한 xid)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11.5">
    <rect x="30" y="84" width="400" height="34" rx="6" fill="#1a222e" stroke="#243040"/><text x="42" y="106" fill="#8b98a9">(id=1, balance=100)  xmin=500  xmax=0</text>
    <rect x="30" y="124" width="400" height="34" rx="6" fill="#1a222e" stroke="#d29922"/><text x="42" y="146" fill="#8b98a9">(id=1, balance=100)  xmin=500  xmax=</text><text x="300" y="146" fill="#d29922">502 ← B 가 갱신</text>
    <rect x="30" y="164" width="400" height="34" rx="6" fill="#1a222e" stroke="#3fb950"/><text x="42" y="186" fill="#e6edf3">(id=1, balance=50)   xmin=502  xmax=0</text><text x="300" y="186" fill="#3fb950">새 튜플</text>
    <text x="30" y="222" fill="#8b98a9">옛 튜플은 dead → VACUUM 이 공간 회수</text>
  </g>
  <rect x="470" y="84" width="400" height="200" rx="10" fill="#121821" stroke="#336791" stroke-width="1.5"/>
  <text x="486" y="108" fill="#58a6ff" font-weight="600">트랜잭션 A 의 스냅샷 (xid 501, "502 는 아직 안 보임")</text>
  <g fill="#8b98a9" font-size="11.5">
    <text x="486" y="134">READ COMMITTED: 문장마다 새 스냅샷</text>
    <text x="500" y="152">SELECT → 100 … (B 커밋) … SELECT → 50   ← non-repeatable</text>
    <text x="486" y="180">REPEATABLE READ: 트랜잭션 시작 스냅샷 고정</text>
    <text x="500" y="198">SELECT → 100 … (B 커밋) … SELECT → 100</text>
    <text x="500" y="216">UPDATE 시도 → could not serialize access (재시도)</text>
    <text x="486" y="244">읽기는 쓰기를 막지 않고, 쓰기는 읽기를 막지 않는다.</text>
    <text x="486" y="262">같은 행을 쓰려는 둘만 잠금으로 직렬화된다.</text>
  </g>
  <text x="30" y="310" fill="#8b98a9" font-size="12">SELECT xmin, xmax, ctid, * FROM acct;  로 직접 볼 수 있다. 오래 열린 트랜잭션은 그 스냅샷이 필요한 dead tuple 의 VACUUM 을 막는다.</text>
</svg>
