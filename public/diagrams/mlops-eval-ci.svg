<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">평가 CI — 프롬프트·모델·검색 변경을 PR 에서 막는다</text>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <rect x="30" y="70" width="150" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="105" y="96" text-anchor="middle" fill="#e6edf3" font-weight="600">PR</text>
  <text x="105" y="118" text-anchor="middle" fill="#8b949e" font-size="11">프롬프트 v8</text>
  <text x="105" y="134" text-anchor="middle" fill="#8b949e" font-size="11">모델·검색 설정</text>
  <text x="105" y="150" text-anchor="middle" fill="#8b949e" font-size="11">paths 필터로 트리거</text>
  <line x1="180" y1="115" x2="218" y2="115" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <!-- ladder -->
  <rect x="220" y="60" width="330" height="230" rx="10" fill="#161b22" stroke="#3b82f6"/>
  <text x="385" y="84" text-anchor="middle" fill="#3b82f6" font-weight="600">어설션의 사다리 (싼 것부터)</text>
  <g font-size="12">
    <rect x="240" y="98" width="290" height="26" rx="4" fill="#0d1117" stroke="#22c55e"/><text x="252" y="116" fill="#22c55e">1 형식 — JSON·스키마·길이</text><text x="520" y="116" text-anchor="end" fill="#8b949e" font-size="11">결정적 · 0원</text>
    <rect x="240" y="130" width="290" height="26" rx="4" fill="#0d1117" stroke="#22c55e"/><text x="252" y="148" fill="#22c55e">2 포함/불포함 — 노트 링크, 금칙어</text><text x="520" y="148" text-anchor="end" fill="#8b949e" font-size="11">결정적</text>
    <rect x="240" y="162" width="290" height="26" rx="4" fill="#0d1117" stroke="#22c55e"/><text x="252" y="180" fill="#22c55e">3 규칙 — 한글 비율, slug 유효성</text><text x="520" y="180" text-anchor="end" fill="#8b949e" font-size="11">결정적</text>
    <rect x="240" y="194" width="290" height="26" rx="4" fill="#0d1117" stroke="#f59e0b"/><text x="252" y="212" fill="#f59e0b">4 유사도 — 임베딩 코사인</text><text x="520" y="212" text-anchor="end" fill="#8b949e" font-size="11">임베딩 1회</text>
    <rect x="240" y="226" width="290" height="26" rx="4" fill="#0d1117" stroke="#ef4444"/><text x="252" y="244" fill="#ef4444">5 LLM 판사 — 루브릭, 강한 모델</text><text x="520" y="244" text-anchor="end" fill="#8b949e" font-size="11">확률적</text>
    <rect x="240" y="258" width="290" height="26" rx="4" fill="#0d1117" stroke="#ef4444"/><text x="252" y="276" fill="#ef4444">6 쌍대 비교 — 순서 교차</text><text x="520" y="276" text-anchor="end" fill="#8b949e" font-size="11">판사 2회</text>
  </g>
  <line x1="550" y1="175" x2="588" y2="175" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <!-- gate -->
  <rect x="590" y="70" width="340" height="210" rx="10" fill="#161b22" stroke="#f59e0b"/>
  <text x="760" y="96" text-anchor="middle" fill="#f59e0b" font-weight="600">회귀 게이트</text>
  <text x="610" y="124" fill="#e6edf3" font-size="12">① 절대 하한: 형식 ≥ 98%, 안전 문항 100%</text>
  <text x="610" y="148" fill="#e6edf3" font-size="12">② 기준선(main) 대비 −3%p 이내 (쌍체, 3회 평균)</text>
  <text x="610" y="172" fill="#e6edf3" font-size="12">③ 어떤 세그먼트도 −10%p 이상 하락 금지</text>
  <text x="610" y="196" fill="#e6edf3" font-size="12">④ 문항당 비용 +20%, p95 지연 > 8초 금지</text>
  <text x="610" y="226" fill="#8b949e" font-size="11">기준선 = MLflow 의 tags.branch=main 최신 run</text>
  <text x="610" y="246" fill="#8b949e" font-size="11">결과 → PR 코멘트 (지표 표 + 실패 문항)</text>
  <text x="610" y="266" fill="#8b949e" font-size="11">의도한 트레이드오프면 사람이 승인 (이유 기록)</text>
  <!-- tiers -->
  <rect x="30" y="310" width="900" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="334" fill="#e6edf3" font-weight="600" font-size="12">비용 계층화</text>
  <text x="50" y="356" fill="#e6edf3" font-size="12">PR: 핵심 50문항 + 결정적 검사 (1~2분)  ·  main 병합: 전체 + 판사  ·  야간: 반복·레드팀·안전 묶음  ·  응답 캐시 키 = (프롬프트 해시, 모델, 입력)</text>
  <text x="50" y="372" fill="#8b949e" font-size="11">비결정성: temperature 0 이어도 판정 1~2건이 흔들린다(실측) → 반복·허용 오차·쌍체 비교, 결정적 검사 우선</text>
</svg>
