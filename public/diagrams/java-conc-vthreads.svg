<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">가상 스레드 — 블로킹하면 캐리어에서 내려오고, 준비되면 아무 캐리어에나 다시 올라탄다</text>
  <text x="140" y="68" text-anchor="middle" fill="#8b949e" font-size="12">가상 스레드 (힙의 객체, 수백만 개 가능)</text>
  <g font-size="11">
    <rect x="40" y="80" width="60" height="26" rx="5" fill="#161b22" stroke="#c084fc"/><text x="70" y="97" text-anchor="middle" fill="#e6edf3">V1</text>
    <rect x="110" y="80" width="60" height="26" rx="5" fill="#161b22" stroke="#c084fc"/><text x="140" y="97" text-anchor="middle" fill="#e6edf3">V2</text>
    <rect x="180" y="80" width="60" height="26" rx="5" fill="#161b22" stroke="#c084fc"/><text x="210" y="97" text-anchor="middle" fill="#e6edf3">V3</text>
    <rect x="40" y="114" width="60" height="26" rx="5" fill="#161b22" stroke="#c084fc"/><text x="70" y="131" text-anchor="middle" fill="#e6edf3">V4</text>
    <rect x="110" y="114" width="60" height="26" rx="5" fill="#161b22" stroke="#c084fc"/><text x="140" y="131" text-anchor="middle" fill="#e6edf3">…</text>
    <rect x="180" y="114" width="60" height="26" rx="5" fill="#161b22" stroke="#c084fc"/><text x="210" y="131" text-anchor="middle" fill="#e6edf3">V10000</text>
  </g>
  <text x="560" y="68" text-anchor="middle" fill="#8b949e" font-size="12">캐리어 = 플랫폼 스레드 (ForkJoinPool, ≈ CPU 코어 수)</text>
  <rect x="380" y="80" width="160" height="40" rx="6" fill="#161b22" stroke="#3b82f6"/><text x="460" y="104" text-anchor="middle" fill="#e6edf3">캐리어 1 ← V1 실행 중</text>
  <rect x="580" y="80" width="160" height="40" rx="6" fill="#161b22" stroke="#3b82f6"/><text x="660" y="104" text-anchor="middle" fill="#e6edf3">캐리어 2 ← V3 실행 중</text>
  <rect x="780" y="80" width="140" height="40" rx="6" fill="#161b22" stroke="#3b82f6"/><text x="850" y="104" text-anchor="middle" fill="#e6edf3">캐리어 N</text>
  <line x1="100" y1="93" x2="378" y2="100" stroke="#8b949e" marker-end="url(#a)"/>
  <!-- unmount -->
  <rect x="40" y="170" width="420" height="96" rx="8" fill="#0f2a1a" stroke="#22c55e"/>
  <text x="250" y="192" text-anchor="middle" fill="#4ade80" font-weight="600">블로킹 호출 (sleep · 소켓 읽기 · JDBC 대기)</text>
  <text x="60" y="214" fill="#e6edf3" font-size="12">① V1 의 스택을 힙의 연속체(continuation)로 떼어 냄 — 언마운트</text>
  <text x="60" y="234" fill="#e6edf3" font-size="12">② 캐리어 1 은 곧바로 다른 가상 스레드(V4)를 실행</text>
  <text x="60" y="254" fill="#e6edf3" font-size="12">③ I/O 준비되면 V1 이 아무 캐리어에나 다시 마운트</text>
  <!-- pinning -->
  <rect x="500" y="170" width="420" height="96" rx="8" fill="#2a0f0f" stroke="#ef4444"/>
  <text x="710" y="192" text-anchor="middle" fill="#f87171" font-weight="600">피닝 (JDK 21): synchronized 안에서 블로킹</text>
  <text x="520" y="214" fill="#e6edf3" font-size="12">모니터가 OS 스레드에 묶여 있어 내려오지 못함</text>
  <text x="520" y="234" fill="#e6edf3" font-size="12">→ 캐리어가 함께 잠듦, 동시 진행 수 = 캐리어 수</text>
  <text x="520" y="254" fill="#8b949e" font-size="12">대처: ReentrantLock · JDK 24+(JEP 491) · tracePinnedThreads</text>
  <!-- results -->
  <rect x="40" y="290" width="880" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="314" fill="#e6edf3" font-weight="600">실측 (100ms 블로킹 작업, CPU 18)</text>
  <text x="60" y="336" fill="#e6edf3" font-size="12">고정 스레드 풀 200 × 1만 작업: 5,091 ms · 플랫폼 스레드 226   |   가상 스레드 × 1만 작업: 126 ms · 플랫폼 스레드 26</text>
  <text x="60" y="358" fill="#e6edf3" font-size="12">가상 스레드 400개, synchronized 안에서 sleep: 2,321 ms (≈ 400 / 18 × 100ms)   |   ReentrantLock 안에서 sleep: 101 ms</text>
</svg>
