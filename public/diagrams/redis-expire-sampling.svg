<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">만료 키는 언제 지워지나 — lazy(접근 시) + active(주기적 샘플링)</text>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <rect x="30" y="60" width="420" height="300" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="240" y="86" text-anchor="middle" fill="#58a6ff" font-weight="600">Active expire (serverCron, hz=10 → 초당 10번)</text>
  <rect x="60" y="104" width="360" height="38" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="240" y="128" text-anchor="middle" fill="#e6edf3">① expires dict 에서 무작위 20개 샘플</text>
  <line x1="240" y1="142" x2="240" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="60" y="162" width="360" height="38" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="240" y="186" text-anchor="middle" fill="#e6edf3">② 만료된 키 삭제</text>
  <line x1="240" y1="200" x2="240" y2="218" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="60" y="220" width="360" height="44" rx="6" fill="#0d1117" stroke="#d29922"/>
  <text x="240" y="240" text-anchor="middle" fill="#d29922">③ 지운 비율 &gt; 25% ?</text>
  <text x="240" y="256" text-anchor="middle" fill="#8b949e" font-size="11">예 → ①로 반복 (시간 예산까지) · 아니오 → 다음 주기</text>
  <path d="M60,242 C20,242 20,123 58,123" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="240" y="300" text-anchor="middle" fill="#8b949e" font-size="12">대량 동시 만료 → 루프가 길게 돌아 지연 스파이크</text>
  <text x="240" y="320" text-anchor="middle" fill="#8b949e" font-size="12">INFO stats: expired_keys · expired_time_cap_reached_count</text>
  <text x="240" y="340" text-anchor="middle" fill="#3fb950" font-size="12">대책: TTL 에 지터(±10%)</text>
  <rect x="510" y="60" width="420" height="300" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="720" y="86" text-anchor="middle" fill="#3fb950" font-weight="600">Lazy expire (키에 접근할 때)</text>
  <rect x="540" y="104" width="360" height="38" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="720" y="128" text-anchor="middle" fill="#e6edf3">GET session:abc</text>
  <line x1="720" y1="142" x2="720" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="540" y="162" width="360" height="38" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="720" y="186" text-anchor="middle" fill="#e6edf3">expireIfNeeded: 만료 시각 지났나?</text>
  <line x1="720" y1="200" x2="720" y2="218" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="540" y="220" width="360" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="720" y="240" text-anchor="middle" fill="#e6edf3">예 → 삭제하고 (nil) 응답</text>
  <text x="720" y="256" text-anchor="middle" fill="#8b949e" font-size="11">lazyfree-lazy-expire yes 면 해제는 백그라운드</text>
  <text x="720" y="300" text-anchor="middle" fill="#8b949e" font-size="12">아무도 안 읽는 만료 키는 샘플링에 걸릴 때까지 메모리 점유</text>
  <text x="720" y="320" text-anchor="middle" fill="#8b949e" font-size="12">외부에서는 항상 "만료된 것처럼" 보인다</text>
  <text x="720" y="340" text-anchor="middle" fill="#8b949e" font-size="12">복제: 마스터가 결정해 레플리카에 DEL 전파</text>
  <text x="480" y="385" text-anchor="middle" fill="#8b949e" font-size="12">메모리가 maxmemory 를 넘으면 별개로 축출(eviction)이 쓰기 명령 실행 직전에 일어난다</text>
</svg>
