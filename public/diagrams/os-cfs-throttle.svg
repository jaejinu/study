<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="360" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">cgroup v2 cpu.max = "50000 100000" — 100ms 마다 50ms, 다 쓰면 멈춘다</text>

  <!-- timeline axis -->
  <line x1="60" y1="250" x2="920" y2="250" stroke="#30363d"/>
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="60" y="268">0</text><text x="275" y="268">100ms</text><text x="490" y="268">200ms</text><text x="705" y="268">300ms</text><text x="920" y="268">400ms</text>
  </g>
  <g stroke="#30363d" stroke-dasharray="3,3">
    <line x1="275" y1="70" x2="275" y2="250"/><line x1="490" y1="70" x2="490" y2="250"/><line x1="705" y1="70" x2="705" y2="250"/>
  </g>

  <!-- busy loop: steady 1 cpu demand -->
  <text x="60" y="80" fill="#e6edf3" font-weight="600">무한 루프 (CPU 1개를 계속 원함)</text>
  <g>
    <rect x="60" y="92" width="107" height="34" fill="#3fb950" fill-opacity="0.7"/><rect x="167" y="92" width="108" height="34" fill="#f85149" fill-opacity="0.35"/>
    <rect x="275" y="92" width="107" height="34" fill="#3fb950" fill-opacity="0.7"/><rect x="382" y="92" width="108" height="34" fill="#f85149" fill-opacity="0.35"/>
    <rect x="490" y="92" width="107" height="34" fill="#3fb950" fill-opacity="0.7"/><rect x="597" y="92" width="108" height="34" fill="#f85149" fill-opacity="0.35"/>
    <rect x="705" y="92" width="107" height="34" fill="#3fb950" fill-opacity="0.7"/><rect x="812" y="92" width="108" height="34" fill="#f85149" fill-opacity="0.35"/>
  </g>
  <text x="113" y="114" text-anchor="middle" fill="#0d1117" font-weight="600">실행 50ms</text>
  <text x="221" y="114" text-anchor="middle" fill="#f85149">스로틀</text>
  <text x="920" y="146" text-anchor="end" fill="#8b949e" font-size="12">실측: 51 주기 중 51 스로틀, 사용 50%, 기다린 시간 2.6초/5초</text>

  <!-- request latency: bursty web request -->
  <text x="60" y="180" fill="#e6edf3" font-weight="600">웹 요청 (평균 사용률은 낮지만 순간 버스트)</text>
  <rect x="275" y="192" width="107" height="34" fill="#3fb950" fill-opacity="0.7"/>
  <rect x="382" y="192" width="108" height="34" fill="#f85149" fill-opacity="0.35"/>
  <rect x="490" y="192" width="22" height="34" fill="#3fb950" fill-opacity="0.7"/>
  <text x="328" y="214" text-anchor="middle" fill="#0d1117" font-size="12">50ms 계산</text>
  <text x="436" y="214" text-anchor="middle" fill="#f85149" font-size="12">쿼터 소진 · 대기 50ms</text>
  <text x="530" y="208" fill="#c9d1d9" font-size="12">← +10ms. CPU 60ms 짜리 요청이 110ms 에 끝난다.</text>
  <text x="530" y="224" fill="#c9d1d9" font-size="12">평균 사용률이 10% 여도 버스트가 쿼터를 넘으면 p99 가 튄다</text>

  <rect x="60" y="290" width="860" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="80" y="312" fill="#c9d1d9" font-size="12">• Kubernetes CPU limits = 이 쿼터. requests 는 cpu.weight(비율 분배)로만 쓰여 스로틀하지 않는다.</text>
  <text x="80" y="332" fill="#c9d1d9" font-size="12">• 지연 민감 서비스는 CPU limit 을 빼거나 넉넉히 · 메트릭: container_cpu_cfs_throttled_periods_total</text>
</svg>
