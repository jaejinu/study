<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="440" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker>
  <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3fb950"/></marker>
  <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#58a6ff"/></marker>
  <marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d29922"/></marker>
  <marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f85149"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">libuv 이벤트 루프 — 한 바퀴(tick)의 단계와, 단계 사이마다 비우는 마이크로태스크</text>
  <!-- phases ring as rectangle loop -->
  <g>
    <rect x="60" y="70" width="190" height="56" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="155" y="94" text-anchor="middle" fill="#58a6ff" font-weight="600">① timers</text>
    <text x="155" y="113" text-anchor="middle" fill="#8b949e" font-size="12">setTimeout · setInterval</text>

    <rect x="385" y="70" width="190" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="480" y="94" text-anchor="middle" fill="#e6edf3" font-weight="600">② pending callbacks</text>
    <text x="480" y="113" text-anchor="middle" fill="#8b949e" font-size="12">미뤄진 시스템 오류 콜백</text>

    <rect x="710" y="70" width="190" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="805" y="94" text-anchor="middle" fill="#e6edf3" font-weight="600">③ idle · prepare</text>
    <text x="805" y="113" text-anchor="middle" fill="#8b949e" font-size="12">내부용</text>

    <rect x="710" y="200" width="190" height="80" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="805" y="224" text-anchor="middle" fill="#3fb950" font-weight="600">④ poll</text>
    <text x="805" y="243" text-anchor="middle" fill="#8b949e" font-size="12">epoll/kqueue 로 I/O 대기</text>
    <text x="805" y="261" text-anchor="middle" fill="#8b949e" font-size="12">소켓·파일 완료 콜백 실행</text>

    <rect x="385" y="212" width="190" height="56" rx="8" fill="#161b22" stroke="#d29922"/>
    <text x="480" y="236" text-anchor="middle" fill="#d29922" font-weight="600">⑤ check</text>
    <text x="480" y="255" text-anchor="middle" fill="#8b949e" font-size="12">setImmediate</text>

    <rect x="60" y="212" width="190" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="155" y="236" text-anchor="middle" fill="#e6edf3" font-weight="600">⑥ close callbacks</text>
    <text x="155" y="255" text-anchor="middle" fill="#8b949e" font-size="12">socket.on("close")</text>
  </g>
  <line x1="252" y1="98" x2="380" y2="98" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="577" y1="98" x2="705" y2="98" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="805" y1="128" x2="805" y2="195" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="708" y1="240" x2="580" y2="240" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="383" y1="240" x2="255" y2="240" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="155" y1="210" x2="155" y2="131" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="168" y="175" fill="#8b949e" font-size="12">다음 바퀴 (활성 핸들·요청이 없으면 종료)</text>

  <!-- microtask pills -->
  <g font-size="11" fill="#f85149">
    <rect x="296" y="76" width="44" height="18" rx="9" fill="#f85149" fill-opacity="0.15" stroke="#f85149"/><text x="318" y="89" text-anchor="middle">μ</text>
    <rect x="621" y="76" width="44" height="18" rx="9" fill="#f85149" fill-opacity="0.15" stroke="#f85149"/><text x="643" y="89" text-anchor="middle">μ</text>
    <rect x="621" y="246" width="44" height="18" rx="9" fill="#f85149" fill-opacity="0.15" stroke="#f85149"/><text x="643" y="259" text-anchor="middle">μ</text>
    <rect x="296" y="246" width="44" height="18" rx="9" fill="#f85149" fill-opacity="0.15" stroke="#f85149"/><text x="318" y="259" text-anchor="middle">μ</text>
  </g>

  <!-- side facts -->
  <rect x="30" y="310" width="900" height="112" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="334" fill="#f85149" font-weight="600">μ = 콜백 하나가 끝날 때마다 nextTick 큐 → Promise 마이크로태스크 큐를 끝까지 비운다</text>
  <text x="50" y="358" fill="#e6edf3">· I/O 콜백 안에서 setTimeout(0) vs setImmediate → poll 다음이 check 이므로 항상 immediate 먼저 (실측 60/60)</text>
  <text x="50" y="380" fill="#e6edf3">· 메인 모듈에서는 1ms 타이머가 첫 timers 단계에 이미 만료됐는지에 달려 순서가 매번 다르다 (실측 timeout 29 · immediate 11)</text>
  <text x="50" y="402" fill="#d29922">· 동기 코드가 200ms 막으면 모든 단계가 200ms 멈춘다 — 이벤트 루프 지연 p99 210ms</text>
</svg>
