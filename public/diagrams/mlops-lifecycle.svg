<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="430" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">ML / LLM 시스템 생애주기 — 관측이 다음 데이터가 되는 순환</text>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker>
  <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#22c55e"/></marker></defs>
  <!-- stages -->
  <g>
    <rect x="30" y="70" width="140" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="100" y="94" text-anchor="middle" fill="#e6edf3" font-weight="600">1. 문제 정의</text>
    <text x="100" y="116" text-anchor="middle" fill="#8b949e" font-size="11">성공 지표·목표값</text>
    <text x="100" y="132" text-anchor="middle" fill="#8b949e" font-size="11">오류의 비용</text>
    <text x="100" y="148" text-anchor="middle" fill="#8b949e" font-size="11">기준선</text>
  </g>
  <g>
    <rect x="200" y="70" width="140" height="92" rx="10" fill="#161b22" stroke="#3b82f6"/>
    <text x="270" y="94" text-anchor="middle" fill="#3b82f6" font-weight="600">2. 데이터</text>
    <text x="270" y="116" text-anchor="middle" fill="#8b949e" font-size="11">수집·라벨·정제</text>
    <text x="270" y="132" text-anchor="middle" fill="#8b949e" font-size="11">분할(누수 방지)</text>
    <text x="270" y="148" text-anchor="middle" fill="#8b949e" font-size="11">버전·데이터 카드</text>
  </g>
  <g>
    <rect x="370" y="70" width="140" height="92" rx="10" fill="#161b22" stroke="#8b5cf6"/>
    <text x="440" y="94" text-anchor="middle" fill="#8b5cf6" font-weight="600">3. 학습 / 적응</text>
    <text x="440" y="116" text-anchor="middle" fill="#8b949e" font-size="11">프롬프트·RAG</text>
    <text x="440" y="132" text-anchor="middle" fill="#8b949e" font-size="11">LoRA·증류</text>
    <text x="440" y="148" text-anchor="middle" fill="#8b949e" font-size="11">실험 추적(MLflow)</text>
  </g>
  <g>
    <rect x="540" y="70" width="140" height="92" rx="10" fill="#161b22" stroke="#f59e0b"/>
    <text x="610" y="94" text-anchor="middle" fill="#f59e0b" font-weight="600">4. 평가</text>
    <text x="610" y="116" text-anchor="middle" fill="#8b949e" font-size="11">골든셋·세그먼트</text>
    <text x="610" y="132" text-anchor="middle" fill="#8b949e" font-size="11">판사 + 결정적 검사</text>
    <text x="610" y="148" text-anchor="middle" fill="#8b949e" font-size="11">회귀 게이트</text>
  </g>
  <g>
    <rect x="710" y="70" width="110" height="92" rx="10" fill="#161b22" stroke="#22c55e"/>
    <text x="765" y="94" text-anchor="middle" fill="#22c55e" font-weight="600">5. 배포</text>
    <text x="765" y="116" text-anchor="middle" fill="#8b949e" font-size="11">레지스트리</text>
    <text x="765" y="132" text-anchor="middle" fill="#8b949e" font-size="11">@champion</text>
    <text x="765" y="148" text-anchor="middle" fill="#8b949e" font-size="11">섀도·카나리</text>
  </g>
  <line x1="170" y1="116" x2="198" y2="116" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="116" x2="368" y2="116" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="510" y1="116" x2="538" y2="116" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="680" y1="116" x2="708" y2="116" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <!-- observe -->
  <rect x="600" y="220" width="320" height="120" rx="10" fill="#161b22" stroke="#ef4444"/>
  <text x="760" y="246" text-anchor="middle" fill="#ef4444" font-weight="600">6. 관측 — 조용한 실패를 잡는다</text>
  <text x="620" y="272" fill="#e6edf3" font-size="12">인프라·요청: TTFT·TPOT·토큰·비용·에러</text>
  <text x="620" y="292" fill="#e6edf3" font-size="12">입력·출력: 분포 드리프트(PSI), 형식 준수율</text>
  <text x="620" y="312" fill="#e6edf3" font-size="12">결과: 👍/👎, 샘플 판사(근거성), 재질문율</text>
  <text x="620" y="330" fill="#8b949e" font-size="11">200 OK 로 틀린 답 → 품질 지표 없이는 안 보인다</text>
  <line x1="765" y1="162" x2="765" y2="218" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <!-- feedback loop -->
  <path d="M600,300 C 420,300 300,300 270,165" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <text x="330" y="290" fill="#22c55e" font-size="12" font-weight="600">실패 사례 → 골든셋·학습 데이터</text>
  <!-- debt box -->
  <rect x="40" y="220" width="250" height="180" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="246" fill="#f59e0b" font-weight="600">숨은 기술 부채</text>
  <text x="60" y="270" fill="#e6edf3" font-size="12">• 얽힘: 하나를 바꾸면 전부 바뀐다</text>
  <text x="60" y="292" fill="#e6edf3" font-size="12">• 미선언 소비자</text>
  <text x="60" y="314" fill="#e6edf3" font-size="12">• 데이터 의존성 (컴파일러가 안 잡음)</text>
  <text x="60" y="336" fill="#e6edf3" font-size="12">• 피드백 루프</text>
  <text x="60" y="358" fill="#e6edf3" font-size="12">• 학습-서빙 불일치</text>
  <text x="60" y="380" fill="#e6edf3" font-size="12">• 공급자 모델 드리프트 (LLM)</text>
  <text x="480" y="415" text-anchor="middle" fill="#8b949e" font-size="11">실험: mlops-eval-harness(평가) · mlops-mlflow-tracking(추적·레지스트리) · mlops-ollama-serving(서빙 관측)</text>
</svg>
