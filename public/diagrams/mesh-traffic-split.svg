<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker>
  <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b82f6"/></marker>
  <marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f59e0b"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">HTTPRoute 가중치 분할 — 나누는 곳은 호출하는 쪽 프록시</text>

  <rect x="40" y="70" width="200" height="90" rx="10" fill="#161b22" stroke="#22c55e"/>
  <text x="140" y="95" text-anchor="middle" fill="#22c55e" font-weight="600">client-meshed</text>
  <text x="140" y="118" text-anchor="middle" fill="#8b949e" font-size="11">curl http://echo/</text>
  <text x="140" y="138" text-anchor="middle" fill="#e6edf3" font-size="12">프록시가 HTTPRoute 적용</text>

  <rect x="40" y="250" width="200" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="140" y="275" text-anchor="middle" fill="#e6edf3" font-weight="600">client-plain (메시 밖)</text>
  <text x="140" y="298" text-anchor="middle" fill="#8b949e" font-size="11">curl http://echo/</text>
  <text x="140" y="318" text-anchor="middle" fill="#8b949e" font-size="12">kube-proxy → Service 셀렉터</text>

  <rect x="330" y="140" width="250" height="120" rx="10" fill="#161b22" stroke="#8b5cf6"/>
  <text x="455" y="165" text-anchor="middle" fill="#8b5cf6" font-weight="600">HTTPRoute echo-split</text>
  <text x="455" y="188" text-anchor="middle" fill="#8b949e" font-size="11">parentRefs: Service echo:80</text>
  <text x="455" y="212" text-anchor="middle" fill="#3b82f6">echo-v1 weight 90</text>
  <text x="455" y="234" text-anchor="middle" fill="#f59e0b">echo-v2 weight 10</text>

  <rect x="690" y="80" width="230" height="80" rx="10" fill="#161b22" stroke="#3b82f6"/>
  <text x="805" y="110" text-anchor="middle" fill="#3b82f6" font-weight="600">echo-v1 (stable)</text>
  <text x="805" y="135" text-anchor="middle" fill="#e6edf3" font-size="12">실측 180/200 = 90.0%</text>
  <rect x="690" y="240" width="230" height="80" rx="10" fill="#161b22" stroke="#f59e0b"/>
  <text x="805" y="270" text-anchor="middle" fill="#f59e0b" font-weight="600">echo-v2 (canary)</text>
  <text x="805" y="295" text-anchor="middle" fill="#e6edf3" font-size="12">실측 20/200 = 10.0%</text>

  <line x1="242" y1="115" x2="328" y2="180" stroke="#22c55e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="582" y1="190" x2="688" y2="125" stroke="#3b82f6" stroke-width="4" marker-end="url(#b)"/>
  <line x1="582" y1="215" x2="688" y2="275" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#o)"/>
  <path d="M242 300 C 450 380, 600 380, 690 140" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="470" y="372" text-anchor="middle" fill="#8b949e" font-size="12">메시 밖: 분할 없이 셀렉터(v1)로만 — 실측 40/40 v1</text>
</svg>
