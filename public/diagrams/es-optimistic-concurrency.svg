<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="330" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">낙관적 동시성 — 같은 버전을 본 두 명령 중 나중 것은 거절된다</text>
  <line x1="120" y1="70" x2="920" y2="70" stroke="#30363d"/>
  <text x="60" y="74" text-anchor="middle" fill="#8b949e" font-size="11">시간 →</text>
  <text x="60" y="124" text-anchor="middle" fill="#60a5fa" font-weight="600">명령 A</text>
  <text x="60" y="204" text-anchor="middle" fill="#c084fc" font-weight="600">명령 B</text>
  <rect x="130" y="102" width="170" height="40" rx="6" fill="#161b22" stroke="#3b82f6"/>
  <text x="215" y="127" text-anchor="middle" fill="#e6edf3" font-size="12">읽기: 잔액 100, v1</text>
  <rect x="320" y="102" width="150" height="40" rx="6" fill="#161b22" stroke="#3b82f6"/>
  <text x="395" y="127" text-anchor="middle" fill="#e6edf3" font-size="12">결정: 출금 가능</text>
  <rect x="490" y="102" width="200" height="40" rx="6" fill="#0f2a1a" stroke="#22c55e"/>
  <text x="590" y="127" text-anchor="middle" fill="#4ade80" font-size="12">insert v2 → 성공</text>
  <rect x="170" y="182" width="170" height="40" rx="6" fill="#161b22" stroke="#9333ea"/>
  <text x="255" y="207" text-anchor="middle" fill="#e6edf3" font-size="12">읽기: 잔액 100, v1</text>
  <rect x="360" y="182" width="150" height="40" rx="6" fill="#161b22" stroke="#9333ea"/>
  <text x="435" y="207" text-anchor="middle" fill="#e6edf3" font-size="12">결정: 출금 가능</text>
  <rect x="530" y="182" width="200" height="40" rx="6" fill="#2a0f12" stroke="#ef4444"/>
  <text x="630" y="207" text-anchor="middle" fill="#f87171" font-size="12">insert v2 → 23505 거절</text>
  <rect x="750" y="182" width="180" height="40" rx="6" fill="#161b22" stroke="#9333ea"/>
  <text x="840" y="200" text-anchor="middle" fill="#e6edf3" font-size="12">다시 읽기: 90, v2</text>
  <text x="840" y="215" text-anchor="middle" fill="#8b949e" font-size="11">→ 다시 결정 → v3</text>
  <line x1="730" y1="202" x2="748" y2="202" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="120" y="248" width="810" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="140" y="272" fill="#e6edf3" font-size="12">unique (stream_id, version) 가 "다음 버전 자리" 를 하나만 허락한다. 잠그지 않고, 나중에 온 쪽을 거절한다.</text>
  <text x="140" y="294" fill="#8b949e" font-size="12">버전 검사가 없으면 B 도 v2 를 써서 둘 다 출금 → 실험에서 20건 동시 출금 시 잔액 −100 (같은 버전 19번 중복)</text>
</svg>
