<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">이벤트 소싱 + CQRS — 쓰기는 사실을 쌓고, 읽기는 파생 모델에서</text>
  <rect x="24" y="90" width="130" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="89" y="117" text-anchor="middle" fill="#e6edf3" font-weight="600">명령</text>
  <text x="89" y="137" text-anchor="middle" fill="#8b949e" font-size="11">WithdrawMoney{10}</text>
  <rect x="196" y="70" width="190" height="104" rx="10" fill="#161b22" stroke="#9333ea"/>
  <text x="291" y="95" text-anchor="middle" fill="#c084fc" font-weight="600">집합 (쓰기 모델)</text>
  <text x="291" y="118" text-anchor="middle" fill="#e6edf3" font-size="12">1 읽기: 스트림을 접어 상태</text>
  <text x="291" y="137" text-anchor="middle" fill="#e6edf3" font-size="12">2 결정: 잔액 ≥ 10 ?</text>
  <text x="291" y="156" text-anchor="middle" fill="#e6edf3" font-size="12">3 추가: expected_version</text>
  <rect x="430" y="60" width="210" height="124" rx="10" fill="#161b22" stroke="#3b82f6"/>
  <text x="535" y="85" text-anchor="middle" fill="#60a5fa" font-weight="600">이벤트 스토어 (진실)</text>
  <text x="535" y="107" text-anchor="middle" fill="#8b949e" font-size="11">append-only · unique(stream, version)</text>
  <text x="450" y="130" fill="#e6edf3" font-size="11" font-family="ui-monospace, monospace">#1 AccountOpened</text>
  <text x="450" y="148" fill="#e6edf3" font-size="11" font-family="ui-monospace, monospace">#2 MoneyDeposited 100</text>
  <text x="450" y="166" fill="#f59e0b" font-size="11" font-family="ui-monospace, monospace">#3 MoneyWithdrawn 10  ← 새 사실</text>
  <rect x="690" y="60" width="244" height="124" rx="10" fill="#161b22" stroke="#22c55e"/>
  <text x="812" y="85" text-anchor="middle" fill="#4ade80" font-weight="600">프로젝터 (체크포인트)</text>
  <text x="812" y="110" text-anchor="middle" fill="#e6edf3" font-size="12">global_position &gt; cp 만 읽기</text>
  <text x="812" y="130" text-anchor="middle" fill="#e6edf3" font-size="12">읽기 모델 갱신 + cp 저장</text>
  <text x="812" y="150" text-anchor="middle" fill="#e6edf3" font-size="12">= 한 트랜잭션</text>
  <text x="812" y="170" text-anchor="middle" fill="#8b949e" font-size="11">부작용 없음 (재생 안전)</text>
  <line x1="154" y1="122" x2="194" y2="122" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="386" y1="122" x2="428" y2="122" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="122" x2="688" y2="122" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="408" y="112" text-anchor="middle" fill="#8b949e" font-size="10">이벤트</text>
  <path d="M291,174 C291,214 520,214 520,186" stroke="#ef4444" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="400" y="222" text-anchor="middle" fill="#f87171" font-size="11">버전 충돌(23505) → 다시 읽고 다시 결정</text>
  <g font-size="12">
    <rect x="600" y="252" width="160" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="680" y="276" text-anchor="middle" fill="#e6edf3">잔액 (PostgreSQL)</text>
    <text x="680" y="295" text-anchor="middle" fill="#8b949e" font-size="11">기본 키 조회</text>
    <rect x="774" y="252" width="160" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="854" y="276" text-anchor="middle" fill="#e6edf3">거래 검색 (OpenSearch)</text>
    <text x="854" y="295" text-anchor="middle" fill="#8b949e" font-size="11">전문 검색</text>
    <rect x="600" y="318" width="160" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="680" y="342" text-anchor="middle" fill="#e6edf3">최근 내역 (Redis)</text>
    <text x="680" y="361" text-anchor="middle" fill="#8b949e" font-size="11">최신 50건</text>
    <rect x="774" y="318" width="160" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="854" y="342" text-anchor="middle" fill="#e6edf3">일별 집계 (ClickHouse)</text>
    <text x="854" y="361" text-anchor="middle" fill="#8b949e" font-size="11">대시보드</text>
  </g>
  <line x1="812" y1="184" x2="812" y2="248" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="826" y="222" fill="#8b949e" font-size="11">여러 읽기 모델</text>
  <rect x="24" y="252" width="540" height="122" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="277" fill="#f59e0b" font-weight="600">실험 수치 (이 사이트)</text>
  <text x="44" y="300" fill="#e6edf3" font-size="12">• 동시 출금 20건, 잔액 100: 버전 검사 + 재시도 → 정확히 10건 성공, 잔액 0 (재시도 55회)</text>
  <text x="44" y="320" fill="#e6edf3" font-size="12">• 버전 검사 없음 → 20건 모두 출금, 잔액 −100</text>
  <text x="44" y="340" fill="#e6edf3" font-size="12">• 10만 이벤트 재생 185ms · 증분 1,000개 6ms · 스냅샷 로딩 20,000행 → 101행</text>
  <text x="44" y="362" fill="#8b949e" font-size="11">es-optimistic-concurrency · es-projection-rebuild</text>
</svg>
