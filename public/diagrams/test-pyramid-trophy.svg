<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="420" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">테스트 피라미드 vs 트로피 — 같은 신뢰를 가장 싸게 사는 배분</text>
  <!-- pyramid -->
  <text x="230" y="64" text-anchor="middle" fill="#8b949e" font-size="12">피라미드 (2009) — 단위가 대부분</text>
  <polygon points="230,80 270,140 190,140" fill="#ef4444" opacity="0.8"/>
  <text x="230" y="128" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="600">E2E</text>
  <polygon points="190,144 270,144 320,214 140,214" fill="#f59e0b" opacity="0.8"/>
  <text x="230" y="186" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="600">통합</text>
  <polygon points="140,218 320,218 380,310 80,310" fill="#22c55e" opacity="0.8"/>
  <text x="230" y="270" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="600">단위</text>
  <!-- trophy -->
  <text x="700" y="64" text-anchor="middle" fill="#8b949e" font-size="12">트로피 (2018) — 통합이 가장 두껍다</text>
  <rect x="670" y="80" width="60" height="44" rx="10" fill="#ef4444" opacity="0.8"/>
  <text x="700" y="107" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="600">E2E</text>
  <rect x="590" y="128" width="220" height="96" rx="30" fill="#f59e0b" opacity="0.8"/>
  <text x="700" y="182" text-anchor="middle" fill="#0d1117" font-size="13" font-weight="600">통합 (진짜 의존성)</text>
  <rect x="640" y="228" width="120" height="44" rx="8" fill="#22c55e" opacity="0.8"/>
  <text x="700" y="255" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="600">단위</text>
  <rect x="600" y="276" width="200" height="34" rx="6" fill="#3b82f6" opacity="0.8"/>
  <text x="700" y="298" text-anchor="middle" fill="#0d1117" font-size="12" font-weight="600">정적 분석 (tsc · eslint)</text>
  <!-- axes notes -->
  <line x1="440" y1="90" x2="440" y2="300" stroke="#30363d" stroke-dasharray="4 4"/>
  <text x="455" y="100" fill="#8b949e" font-size="11">↑ 느림·비쌈·깨지기 쉬움</text>
  <text x="455" y="116" fill="#8b949e" font-size="11">↑ 사용자에 가까운 신뢰</text>
  <text x="455" y="290" fill="#8b949e" font-size="11">↓ 빠름·쌈·결정적</text>
  <text x="455" y="306" fill="#8b949e" font-size="11">↓ 실패 위치가 정확</text>
  <rect x="40" y="330" width="880" height="74" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="354" fill="#e6edf3" font-size="12">순수 로직 → 단위·속성 기반  ·  경계(DB·캐시·큐·HTTP) → 진짜 의존성 통합  ·  핵심 여정 몇 개 → E2E  ·  오타·타입 → 정적 분석</text>
  <text x="60" y="376" fill="#8b949e" font-size="12">컨테이너가 통합 테스트를 싸게 만들었다 — 이 사이트의 실험 프레임워크(rec.check)는 진짜 Redis 위의 통합 테스트다</text>
  <text x="60" y="394" fill="#8b949e" font-size="11">커버리지 100% ≠ 검증 100% — test-mutation-mini: 커버리지 100% 에 뮤테이션 점수 38%</text>
</svg>
