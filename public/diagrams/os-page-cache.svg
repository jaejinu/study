<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="440" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker>
  <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3fb950"/></marker>
  <marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d29922"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">페이지 캐시 — 읽기·쓰기는 메모리를 거치고, 디스크는 나중이다</text>

  <!-- user space -->
  <rect x="30" y="55" width="900" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="78" fill="#8b949e">유저 공간</text>
  <rect x="140" y="70" width="180" height="42" rx="6" fill="#0d1117" stroke="#58a6ff"/>
  <text x="230" y="96" text-anchor="middle" fill="#58a6ff">read(fd, buf, 4096)</text>
  <rect x="390" y="70" width="180" height="42" rx="6" fill="#0d1117" stroke="#d29922"/>
  <text x="480" y="96" text-anchor="middle" fill="#d29922">write(fd, buf, 4096)</text>
  <rect x="640" y="70" width="140" height="42" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="710" y="96" text-anchor="middle" fill="#f85149">fsync(fd)</text>
  <text x="850" y="96" text-anchor="middle" fill="#8b949e" font-size="12">O_DIRECT →</text>

  <!-- page cache -->
  <rect x="30" y="160" width="900" height="120" rx="10" fill="#161b22" stroke="#3fb950"/>
  <text x="50" y="183" fill="#3fb950" font-weight="600">커널 — 페이지 캐시 (남는 메모리 전부, 4KiB 페이지)</text>
  <rect x="60" y="200" width="70" height="56" rx="4" fill="#238636" fill-opacity="0.4" stroke="#3fb950"/>
  <rect x="140" y="200" width="70" height="56" rx="4" fill="#238636" fill-opacity="0.4" stroke="#3fb950"/>
  <rect x="220" y="200" width="70" height="56" rx="4" fill="#238636" fill-opacity="0.4" stroke="#3fb950"/>
  <text x="175" y="272" text-anchor="middle" fill="#3fb950" font-size="12">clean (디스크와 같음) — 언제든 버릴 수 있다</text>
  <rect x="400" y="200" width="70" height="56" rx="4" fill="#9e6a03" fill-opacity="0.45" stroke="#d29922"/>
  <rect x="480" y="200" width="70" height="56" rx="4" fill="#9e6a03" fill-opacity="0.45" stroke="#d29922"/>
  <text x="475" y="272" text-anchor="middle" fill="#d29922" font-size="12">Dirty (아직 디스크에 없음)</text>
  <text x="760" y="215" text-anchor="middle" fill="#8b949e" font-size="12">readahead: 순차 읽기를 감지하면</text>
  <text x="760" y="233" text-anchor="middle" fill="#8b949e" font-size="12">128KiB 씩 미리 읽어 둔다</text>
  <text x="760" y="255" text-anchor="middle" fill="#8b949e" font-size="12">drop_caches → clean 만 버린다</text>

  <!-- disk -->
  <rect x="30" y="330" width="900" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="353" fill="#e6edf3" font-weight="600">블록 장치 (NVMe / EBS / Docker Desktop 가상 디스크)</text>
  <text x="50" y="378" fill="#8b949e" font-size="12">4KiB 랜덤 읽기 수십~수백 µs · 메모리는 0.1~1 µs</text>

  <!-- arrows -->
  <line x1="230" y1="114" x2="230" y2="196" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="240" y="150" fill="#58a6ff" font-size="12">적중 → 복사만 (빠름)</text>
  <line x1="120" y1="258" x2="120" y2="326" stroke="#3fb950" stroke-width="2" marker-end="url(#g)"/>
  <text x="128" y="305" fill="#3fb950" font-size="12">미스 → 디스크에서 채움</text>
  <line x1="480" y1="114" x2="480" y2="196" stroke="#d29922" stroke-width="2" marker-end="url(#o)"/>
  <text x="490" y="150" fill="#d29922" font-size="12">캐시에 쓰고 바로 반환</text>
  <line x1="510" y1="258" x2="510" y2="326" stroke="#d29922" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#o)"/>
  <text x="520" y="300" fill="#d29922" font-size="12">플러셔가 나중에 (dirty_expire 30s)</text>
  <line x1="710" y1="114" x2="600" y2="326" stroke="#f85149" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="300" fill="#f85149" font-size="12">fsync: 내려갈 때까지 기다림</text>
  <line x1="850" y1="104" x2="850" y2="326" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="858" y="230" fill="#8b949e" font-size="12">캐시 우회</text>
  <text x="480" y="425" text-anchor="middle" fill="#8b949e" font-size="12">실험: os-page-cache — 256MiB 쓰기 직후 Dirty +256MiB, sync 후 0, 4KiB O_DIRECT 는 캐시보다 33배 느림</text>
</svg>
