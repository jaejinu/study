<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="440" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">Parquet — 행 그룹 × 열 청크, 끝의 footer 통계로 건너뛴다</text>

  <rect x="30" y="56" width="520" height="364" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="80" fill="#e6edf3" font-weight="600">ev_zstd.parquet (100만 행, 행 그룹 10개)</text>

  <!-- row group 0 -->
  <rect x="50" y="94" width="480" height="76" rx="6" fill="#0d1117" stroke="#22c55e"/>
  <text x="62" y="112" fill="#22c55e" font-size="12">행 그룹 0 (10만 행)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="62" y="122" width="100" height="38" rx="4" fill="#3b82f633" stroke="#3b82f6"/><text x="112" y="146" fill="#e6edf3">ts</text>
    <rect x="178" y="122" width="100" height="38" rx="4" fill="#161b22" stroke="#30363d"/><text x="228" y="146" fill="#e6edf3">user_id</text>
    <rect x="294" y="122" width="100" height="38" rx="4" fill="#facc1533" stroke="#facc15"/><text x="344" y="146" fill="#e6edf3">event (사전)</text>
    <rect x="410" y="122" width="108" height="38" rx="4" fill="#facc1533" stroke="#facc15"/><text x="464" y="146" fill="#e6edf3">amount</text>
  </g>
  <!-- row group 1 -->
  <rect x="50" y="180" width="480" height="76" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="62" y="198" fill="#8b949e" font-size="12">행 그룹 1</text>
  <g font-size="11" text-anchor="middle">
    <rect x="62" y="208" width="100" height="38" rx="4" fill="#161b22" stroke="#30363d"/><text x="112" y="232" fill="#8b949e">ts</text>
    <rect x="178" y="208" width="100" height="38" rx="4" fill="#161b22" stroke="#30363d"/><text x="228" y="232" fill="#8b949e">user_id</text>
    <rect x="294" y="208" width="100" height="38" rx="4" fill="#161b22" stroke="#30363d"/><text x="344" y="232" fill="#8b949e">event</text>
    <rect x="410" y="208" width="108" height="38" rx="4" fill="#161b22" stroke="#30363d"/><text x="464" y="232" fill="#8b949e">amount</text>
  </g>
  <text x="290" y="278" text-anchor="middle" fill="#8b949e">⋮  행 그룹 2 … 9</text>

  <!-- footer -->
  <rect x="50" y="292" width="480" height="114" rx="6" fill="#0d1117" stroke="#3b82f6"/>
  <text x="62" y="312" fill="#3b82f6" font-weight="600">footer (먼저 읽는다)</text>
  <text x="62" y="334" fill="#e6edf3" font-size="12">스키마 · 행 그룹마다 열마다 위치·크기·인코딩·통계</text>
  <text x="62" y="356" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11">RG0 ts: min 10-01 00:00  max 10-02 03:52</text>
  <text x="62" y="374" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11">RG1 ts: min 10-02 03:52  max 10-03 07:45</text>
  <text x="62" y="392" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11">RG4 ts: min 10-05 15:23  …</text>

  <!-- right: explanation -->
  <rect x="580" y="56" width="350" height="170" rx="10" fill="#161b22" stroke="#facc15"/>
  <text x="600" y="80" fill="#facc15" font-weight="600">① 열 건너뛰기 (projection)</text>
  <text x="600" y="104" fill="#e6edf3" font-size="12">SELECT event, avg(amount) …</text>
  <text x="600" y="126" fill="#e6edf3" font-size="12">→ 노란 열 청크만 범위 요청으로 읽음</text>
  <text x="600" y="148" fill="#e6edf3" font-size="12">→ ts·user_id 는 한 바이트도 안 읽음</text>
  <text x="600" y="176" fill="#8b949e" font-size="12">CSV 40.6MB 42ms</text>
  <text x="600" y="196" fill="#8b949e" font-size="12">Parquet ZSTD 9.0MB 1.7ms (실측)</text>

  <rect x="580" y="240" width="350" height="180" rx="10" fill="#161b22" stroke="#3b82f6"/>
  <text x="600" y="264" fill="#3b82f6" font-weight="600">② 행 그룹 건너뛰기 (predicate)</text>
  <text x="600" y="288" fill="#e6edf3" font-size="12">WHERE ts BETWEEN 10-05 00:00 AND 01:00</text>
  <text x="600" y="310" fill="#e6edf3" font-size="12">→ footer 의 min/max 와 겹치는 그룹만</text>
  <text x="600" y="338" fill="#22c55e" font-size="12">시간순으로 쓴 파일: 후보 1 / 10</text>
  <text x="600" y="360" fill="#ef4444" font-size="12">섞어서 쓴 파일: 후보 10 / 10</text>
  <text x="600" y="384" fill="#8b949e" font-size="11">모든 그룹의 min/max 가 전체 범위를 덮으면</text>
  <text x="600" y="400" fill="#8b949e" font-size="11">통계가 아무것도 못 거른다 → 정렬해서 쓴다</text>
  <line x1="534" y1="356" x2="576" y2="330" stroke="#8b949e" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
