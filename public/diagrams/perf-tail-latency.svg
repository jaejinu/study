<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">꼬리 지연 증폭 — 팬아웃이 클수록 '드문 느림' 이 '흔한 느림' 이 된다</text>
  <!-- left: fanout -->
  <rect x="20" y="55" width="440" height="330" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="240" y="80" text-anchor="middle" fill="#f59e0b" font-weight="600">요청 1개 → 백엔드 N개 팬아웃</text>
  <rect x="190" y="100" width="100" height="32" rx="6" fill="#0d1117" stroke="#3b82f6"/><text x="240" y="121" text-anchor="middle" fill="#e6edf3">프론트</text>
  <g>
    <rect x="40" y="180" width="60" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="70" y="198" text-anchor="middle" fill="#8b949e" font-size="11">10ms</text>
    <rect x="115" y="180" width="60" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="145" y="198" text-anchor="middle" fill="#8b949e" font-size="11">9ms</text>
    <rect x="190" y="180" width="60" height="28" rx="5" fill="#0d1117" stroke="#ef4444" stroke-width="2"/><text x="220" y="198" text-anchor="middle" fill="#ef4444" font-size="11">800ms</text>
    <rect x="265" y="180" width="60" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="295" y="198" text-anchor="middle" fill="#8b949e" font-size="11">11ms</text>
    <rect x="340" y="180" width="60" height="28" rx="5" fill="#0d1117" stroke="#30363d"/><text x="370" y="198" text-anchor="middle" fill="#8b949e" font-size="11">10ms</text>
    <text x="420" y="198" fill="#8b949e" font-size="11">… ×100</text>
  </g>
  <line x1="230" y1="134" x2="75" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="236" y1="134" x2="148" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="240" y1="134" x2="222" y2="178" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>
  <line x1="244" y1="134" x2="292" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="250" y1="134" x2="365" y2="178" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="240" y="240" text-anchor="middle" fill="#e6edf3" font-size="12">페이지 지연 = 가장 느린 응답 = 800ms</text>
  <text x="240" y="268" text-anchor="middle" fill="#8b949e" font-size="12">서버 하나의 p99 = 10ms+ 일 때 (1% 확률)</text>
  <text x="240" y="288" text-anchor="middle" fill="#8b949e" font-size="12">N=1: 1%   N=10: 10%   N=100: 63%   N=1000: 99.99%</text>
  <text x="240" y="308" text-anchor="middle" fill="#f59e0b" font-size="12">P(느림) = 1 − 0.99^N</text>
  <text x="240" y="340" text-anchor="middle" fill="#8b949e" font-size="11">원인: GC · 백그라운드 압축 · 큐잉 · 자원 공유 · 캐시 미스 · 스로틀링</text>
  <!-- right: hedging -->
  <rect x="485" y="55" width="455" height="330" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="712" y="80" text-anchor="middle" fill="#22c55e" font-weight="600">대책 — 변동을 줄이거나, 중복으로 견디거나</text>
  <!-- timeline hedged -->
  <text x="500" y="110" fill="#e6edf3" font-size="12" font-weight="600">헤징 요청 (hedged request)</text>
  <line x1="500" y1="140" x2="920" y2="140" stroke="#30363d"/>
  <rect x="500" y="128" width="300" height="24" rx="4" fill="#ef4444" opacity="0.35"/><text x="650" y="144" text-anchor="middle" fill="#e6edf3" font-size="11">복제본 A: 느림 (800ms) → 취소</text>
  <line x1="560" y1="118" x2="560" y2="166" stroke="#f59e0b" stroke-dasharray="3 2"/><text x="560" y="178" text-anchor="middle" fill="#f59e0b" font-size="10">p95 경과 → 헤지</text>
  <rect x="560" y="156" width="60" height="24" rx="4" fill="#22c55e" opacity="0.6"/><text x="590" y="172" text-anchor="middle" fill="#e6edf3" font-size="11">B: 10ms ✓</text>
  <text x="500" y="205" fill="#8b949e" font-size="11">부하 +~5% 로 p99.9 를 수십 배 개선. 멱등(읽기)에만.</text>
  <!-- list -->
  <g font-size="12">
    <text x="500" y="240" fill="#e6edf3" font-weight="600">변동 줄이기</text>
    <text x="500" y="260" fill="#8b949e">• 등급 분리(대화형 우선) • 큰 작업 쪼개기 • GC/압축 시차 • 캐시 웜업</text>
    <text x="500" y="290" fill="#e6edf3" font-weight="600">변동 견디기</text>
    <text x="500" y="310" fill="#8b949e">• 헤징/tied request • 마이크로 파티션·선택적 복제 • 95% 응답으로 결과</text>
    <text x="500" y="340" fill="#e6edf3" font-weight="600">폭풍 막기</text>
    <text x="500" y="360" fill="#8b949e">• 적응형 타임아웃 • 재시도 예산+지터 • 데드라인 전파 • 부하 차단(503)</text>
  </g>
</svg>
