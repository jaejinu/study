<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="420" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">요청이 Pod 에 닿기까지 — Ingress → Service → EndpointSlice → Pod</text>
  <rect x="20" y="80" width="110" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="75" y="106" text-anchor="middle" fill="#e6edf3" font-weight="600">클라이언트</text>
  <text x="75" y="125" text-anchor="middle" fill="#8b949e" font-size="11">study.local</text>
  <line x1="130" y1="112" x2="166" y2="112" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="168" y="70" width="170" height="84" rx="8" fill="#161b22" stroke="#22c55e"/>
  <text x="253" y="94" text-anchor="middle" fill="#22c55e" font-weight="600">Ingress controller</text>
  <text x="253" y="114" text-anchor="middle" fill="#e6edf3" font-size="11">(ingress-nginx Pod)</text>
  <text x="253" y="132" text-anchor="middle" fill="#8b949e" font-size="11">host·path 규칙 → Service</text>
  <line x1="338" y1="112" x2="374" y2="112" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="376" y="70" width="180" height="84" rx="8" fill="#161b22" stroke="#3b82f6"/>
  <text x="466" y="94" text-anchor="middle" fill="#3b82f6" font-weight="600">Service web (ClusterIP)</text>
  <text x="466" y="114" text-anchor="middle" fill="#e6edf3" font-size="11">가상 IP 10.96.x.x:3000</text>
  <text x="466" y="132" text-anchor="middle" fill="#8b949e" font-size="11">selector app=web</text>
  <line x1="556" y1="112" x2="592" y2="112" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="594" y="70" width="170" height="84" rx="8" fill="#161b22" stroke="#f59e0b"/>
  <text x="679" y="94" text-anchor="middle" fill="#f59e0b" font-weight="600">EndpointSlice</text>
  <text x="679" y="114" text-anchor="middle" fill="#e6edf3" font-size="11">Ready 인 Pod IP 만</text>
  <text x="679" y="132" text-anchor="middle" fill="#8b949e" font-size="11">readinessProbe 가 결정</text>
  <line x1="764" y1="112" x2="800" y2="112" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="802" y="62" width="140" height="44" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="872" y="89" text-anchor="middle" fill="#e6edf3" font-size="12">Pod web-1 ✓</text>
  <rect x="802" y="114" width="140" height="44" rx="6" fill="#161b22" stroke="#ff4438" stroke-dasharray="4 3"/>
  <text x="872" y="141" text-anchor="middle" fill="#ff4438" font-size="12">Pod web-2 (NotReady)</text>
  <!-- data plane -->
  <rect x="376" y="182" width="388" height="76" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="390" y="204" fill="#e6edf3" font-weight="600">데이터 경로를 실제로 만드는 것: 각 노드의 kube-proxy</text>
  <text x="390" y="226" fill="#e6edf3" font-size="12">iptables/IPVS 규칙: ClusterIP → Pod IP 로 DNAT (무작위 선택)</text>
  <text x="390" y="246" fill="#8b949e" font-size="12">Cilium 은 eBPF 로 대체 (eBPF 노트 04)</text>
  <!-- dns -->
  <rect x="20" y="182" width="330" height="76" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="34" y="204" fill="#e6edf3" font-weight="600">이름 해석: CoreDNS</text>
  <text x="34" y="226" fill="#e6edf3" font-size="12">web.study.svc.cluster.local → ClusterIP</text>
  <text x="34" y="246" fill="#8b949e" font-size="12">egress 기본 거부 시 53 을 열어야 한다 (보안 06)</text>
  <!-- notes -->
  <rect x="20" y="280" width="922" height="124" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="34" y="304" fill="#e6edf3" font-weight="600">실무에서 자주 겪는 것</text>
  <text x="34" y="328" fill="#e6edf3" font-size="12">• 롤링 업데이트 중 502: Pod 가 Ready 전에 트래픽을 받거나, 종료 중인데 EndpointSlice 에서 늦게 빠짐 → preStop sleep · readinessProbe</text>
  <text x="34" y="350" fill="#e6edf3" font-size="12">• Service 는 L4 — HTTP 재시도·타임아웃이 없다. 그건 Ingress·메시·앱이 한다 (nginx 노트 02 의 proxy_next_upstream)</text>
  <text x="34" y="372" fill="#e6edf3" font-size="12">• 연결 재사용(keep-alive)은 한 Pod 에 고정된다 — gRPC·HTTP/2 는 L7 로드밸런싱이 필요 (API 설계 노트 03)</text>
  <text x="34" y="394" fill="#8b949e" font-size="11">kubectl get endpointslices -l kubernetes.io/service-name=web -o wide  ·  kubectl -n study describe svc web</text>
</svg>
