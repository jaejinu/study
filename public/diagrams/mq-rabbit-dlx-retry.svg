<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="420" fill="#0d1117"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker>
        <marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f0883e"/></marker></defs>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">RabbitMQ 지연 재시도 — DLX 와 TTL 로 만드는 순환</text>

  <rect x="30" y="90" width="120" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="90" y="114" text-anchor="middle" fill="#e6edf3" font-weight="600">생산자</text>
  <text x="90" y="133" text-anchor="middle" fill="#8b949e" font-size="11">confirm 채널</text>

  <rect x="210" y="90" width="130" height="56" rx="10" fill="#161b22" stroke="#ff6600"/>
  <text x="275" y="114" text-anchor="middle" fill="#ff6600" font-weight="600">work.x</text>
  <text x="275" y="133" text-anchor="middle" fill="#8b949e" font-size="11">direct, key=job</text>

  <rect x="400" y="80" width="190" height="76" rx="10" fill="#161b22" stroke="#58a6ff"/>
  <text x="495" y="104" text-anchor="middle" fill="#58a6ff" font-weight="600">work 큐</text>
  <text x="495" y="124" text-anchor="middle" fill="#8b949e" font-size="11">x-dead-letter-exchange</text>
  <text x="495" y="140" text-anchor="middle" fill="#8b949e" font-size="11">= retry.x</text>

  <rect x="660" y="80" width="260" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="790" y="104" text-anchor="middle" fill="#e6edf3" font-weight="600">소비자</text>
  <text x="790" y="124" text-anchor="middle" fill="#8b949e" font-size="11">attempt = x-death(work, rejected).count + 1</text>
  <text x="790" y="140" text-anchor="middle" fill="#8b949e" font-size="11">성공 → ack · 실패 → nack(requeue=false)</text>

  <line x1="150" y1="118" x2="208" y2="118" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="118" x2="398" y2="118" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="590" y1="118" x2="658" y2="118" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- 재시도 경로 -->
  <rect x="400" y="236" width="190" height="76" rx="10" fill="#161b22" stroke="#f0883e"/>
  <text x="495" y="260" text-anchor="middle" fill="#f0883e" font-weight="600">retry 큐 (소비자 없음)</text>
  <text x="495" y="280" text-anchor="middle" fill="#8b949e" font-size="11">x-message-ttl = 400ms</text>
  <text x="495" y="296" text-anchor="middle" fill="#8b949e" font-size="11">x-dead-letter-exchange = work.x</text>

  <rect x="660" y="246" width="130" height="56" rx="10" fill="#161b22" stroke="#f0883e"/>
  <text x="725" y="270" text-anchor="middle" fill="#f0883e" font-weight="600">retry.x</text>
  <text x="725" y="289" text-anchor="middle" fill="#8b949e" font-size="11">direct, key=job</text>

  <path d="M790,156 L790,200 L725,200 L725,244" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#r)"/>
  <text x="800" y="200" fill="#f0883e" font-size="12">① nack → DLX</text>
  <line x1="660" y1="274" x2="592" y2="274" stroke="#f0883e" stroke-width="2" marker-end="url(#r)"/>
  <path d="M400,274 L275,274 L275,148" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#r)"/>
  <text x="180" y="230" fill="#f0883e" font-size="12">② 400ms 만료 → work.x 로</text>

  <rect x="830" y="330" width="100" height="56" rx="10" fill="#161b22" stroke="#f85149"/>
  <text x="880" y="354" text-anchor="middle" fill="#f85149" font-weight="600">dead 큐</text>
  <text x="880" y="373" text-anchor="middle" fill="#8b949e" font-size="11">사람이 본다</text>
  <path d="M900,156 L900,328" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="790" y="322" fill="#f85149" font-size="12" text-anchor="end">③ 3번째 실패 → dead 로 보내고 ack</text>

  <text x="30" y="350" fill="#e6edf3" font-weight="600">실측 (poison 메시지)</text>
  <text x="30" y="372" fill="#8b949e" font-size="12">2ms 시도1 실패 → 404ms 시도2 실패 → 806ms 시도3 → dead</text>
  <text x="30" y="392" fill="#8b949e" font-size="12">재시도 간격 402ms, 402ms · requeue=true 였다면 즉시 무한 재배달(핫 루프)</text>
</svg>
