<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="400" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">뮤테이션 테스트 — 일부러 심은 버그를 테스트가 잡는가</text>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
  <rect x="30" y="60" width="300" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="84" fill="#8b949e" font-size="11">원본</text>
  <text x="50" y="106" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="12">if (isMember &amp;&amp; total &gt;= 30000) return 0;</text>
  <text x="50" y="126" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="12">if (total &gt;= 50000) return 0;</text>
  <text x="50" y="146" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="12">return 3000;</text>
  <line x1="330" y1="115" x2="368" y2="115" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="370" y="50" width="260" height="130" rx="10" fill="#161b22" stroke="#8b5cf6"/>
  <text x="500" y="74" text-anchor="middle" fill="#8b5cf6" font-weight="600">돌연변이 8개</text>
  <text x="390" y="96" fill="#e6edf3" font-size="12">&gt;= 30000 → &gt; 30000</text>
  <text x="390" y="114" fill="#e6edf3" font-size="12">&gt;= 50000 → &gt; 50000</text>
  <text x="390" y="132" fill="#e6edf3" font-size="12">&amp;&amp; → ||,   30000 → 3000</text>
  <text x="390" y="150" fill="#e6edf3" font-size="12">조건 삭제, return 값 바꾸기 …</text>
  <text x="390" y="168" fill="#8b949e" font-size="11">각각 컴파일해 테스트 묶음 실행</text>
  <line x1="630" y1="115" x2="668" y2="115" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="670" y="50" width="260" height="130" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="690" y="78" fill="#22c55e" font-weight="600">테스트 실패 → 죽였다 ✓</text>
  <text x="690" y="98" fill="#8b949e" font-size="11">테스트가 이 버그를 잡는다</text>
  <text x="690" y="130" fill="#f59e0b" font-weight="600">모두 통과 → 살아남았다 ⚠</text>
  <text x="690" y="150" fill="#8b949e" font-size="11">= 테스트에 빠진 질문</text>
  <text x="690" y="168" fill="#8b949e" font-size="11">점수 = 죽인 수 / (전체 − 동등)</text>
  <!-- results -->
  <rect x="30" y="210" width="440" height="160" rx="10" fill="#161b22" stroke="#ef4444"/>
  <text x="50" y="236" fill="#ef4444" font-weight="600">약한 테스트 3개 — 커버리지 100%</text>
  <rect x="50" y="252" width="150" height="16" rx="3" fill="#22c55e" opacity="0.8"/><rect x="200" y="252" width="250" height="16" rx="3" fill="#f59e0b" opacity="0.8"/>
  <text x="50" y="290" fill="#e6edf3" font-size="12">뮤테이션 점수 38% (3/8)</text>
  <text x="50" y="312" fill="#8b949e" font-size="12">살아남음: &gt;= 경계 두 개, &amp;&amp;→||, 30000→3000, 조건 삭제</text>
  <text x="50" y="334" fill="#8b949e" font-size="12">→ 정확히 3만·5만 원, 비회원 3~5만 원을 안 봤다</text>
  <text x="50" y="356" fill="#8b949e" font-size="11">실행됐다 ≠ 검증됐다</text>
  <rect x="490" y="210" width="440" height="160" rx="10" fill="#161b22" stroke="#22c55e"/>
  <text x="510" y="236" fill="#22c55e" font-weight="600">+ 경계값 5개 — 커버리지 그대로 100%</text>
  <rect x="510" y="252" width="400" height="16" rx="3" fill="#22c55e" opacity="0.8"/>
  <text x="510" y="290" fill="#e6edf3" font-size="12">뮤테이션 점수 100% (8/8)</text>
  <text x="510" y="312" fill="#8b949e" font-size="12">29999/30000 회원, 49999/50000 비회원, 40000 비회원</text>
  <text x="510" y="334" fill="#8b949e" font-size="12">Stryker: perTest 커버리지·증분 실행으로 비용을 줄인다</text>
  <text x="510" y="356" fill="#8b949e" font-size="11">실험: test-mutation-mini</text>
</svg>
