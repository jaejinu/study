<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <rect width="960" height="420" fill="#0d1117"/>
  <text x="480" y="30" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">eBPF 훅 지점 — 어디에 붙이느냐가 할 수 있는 일과 비용을 정한다</text>
  <!-- user space band -->
  <rect x="30" y="50" width="900" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="72" fill="#8b949e" font-size="12">유저 공간</text>
  <rect x="150" y="62" width="150" height="44" rx="8" fill="#0d1117" stroke="#a78bfa"/><text x="225" y="82" text-anchor="middle" fill="#a78bfa">앱 함수</text><text x="225" y="98" text-anchor="middle" fill="#8b949e" font-size="11">uprobe · USDT</text>
  <rect x="330" y="62" width="150" height="44" rx="8" fill="#0d1117" stroke="#a78bfa"/><text x="405" y="82" text-anchor="middle" fill="#a78bfa">소켓 syscall</text><text x="405" y="98" text-anchor="middle" fill="#8b949e" font-size="11">cgroup/connect4</text>
  <rect x="560" y="62" width="330" height="44" rx="8" fill="#0d1117" stroke="#30363d"/><text x="725" y="82" text-anchor="middle" fill="#e6edf3">bpftrace · BCC · libbpf 에이전트</text><text x="725" y="98" text-anchor="middle" fill="#8b949e" font-size="11">맵 · 링버퍼로 요약을 읽는다</text>
  <!-- kernel band -->
  <rect x="30" y="135" width="900" height="200" rx="10" fill="#161b22" stroke="#3b82f6"/>
  <text x="50" y="157" fill="#3b82f6" font-size="12">커널</text>
  <rect x="60" y="170" width="190" height="60" rx="8" fill="#0d1117" stroke="#22c55e"/><text x="155" y="195" text-anchor="middle" fill="#22c55e">syscall · 스케줄러 · 파일</text><text x="155" y="213" text-anchor="middle" fill="#8b949e" font-size="11">tracepoint · kprobe · kfunc</text>
  <rect x="270" y="170" width="190" height="60" rx="8" fill="#0d1117" stroke="#22c55e"/><text x="365" y="195" text-anchor="middle" fill="#22c55e">타이머 · PMU</text><text x="365" y="213" text-anchor="middle" fill="#8b949e" font-size="11">perf_event (profile:hz:99)</text>
  <rect x="480" y="170" width="190" height="60" rx="8" fill="#0d1117" stroke="#ef4444"/><text x="575" y="195" text-anchor="middle" fill="#ef4444">보안 판단 지점</text><text x="575" y="213" text-anchor="middle" fill="#8b949e" font-size="11">LSM (허용/거부 반환)</text>
  <rect x="690" y="170" width="220" height="60" rx="8" fill="#0d1117" stroke="#22c55e"/><text x="800" y="195" text-anchor="middle" fill="#22c55e">TCP 상태 전이</text><text x="800" y="213" text-anchor="middle" fill="#8b949e" font-size="11">sock:inet_sock_set_state</text>
  <!-- net path -->
  <rect x="60" y="250" width="850" height="70" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="75" y="270" fill="#8b949e" font-size="11">수신 경로</text>
  <text x="120" y="300" fill="#f59e0b" font-weight="600">XDP</text><text x="160" y="300" fill="#8b949e">→ sk_buff →</text>
  <text x="255" y="300" fill="#f59e0b" font-weight="600">TC ingress</text><text x="340" y="300" fill="#8b949e">→ netfilter → 라우팅 →</text>
  <text x="500" y="300" fill="#f59e0b" font-weight="600">socket / sockops / sk_msg</text><text x="690" y="300" fill="#8b949e">→ 앱 (송신은</text><text x="790" y="300" fill="#f59e0b" font-weight="600">TC egress</text><text x="865" y="300" fill="#8b949e">)</text>
  <!-- NIC -->
  <rect x="30" y="345" width="900" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="50" y="370" fill="#e6edf3">NIC / 드라이버 — XDP 는 sk_buff 를 만들기 전에 실행돼 코어당 초당 천만 패킷 이상을 버리거나 돌려보낸다</text>
  <text x="50" y="392" fill="#8b949e" font-size="12">초록 = 관측(읽기), 빨강 = 판단(거부 가능), 노랑 = 패킷 처리(수정·리다이렉트·드롭). 같은 커널의 모든 컨테이너가 보인다.</text>
</svg>
