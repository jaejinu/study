<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="ui-sans-serif, system-ui, 'Apple SD Gothic Neo', sans-serif" font-size="12.5">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8b98a9"/></marker></defs>
  <rect width="900" height="300" fill="#0d1117"/>
  <text x="30" y="32" fill="#e6edf3" font-weight="600" font-size="15">서킷브레이커 상태 머신</text>
  <g stroke-width="2">
    <circle cx="160" cy="150" r="58" fill="#121821" stroke="#3fb950"/><text x="160" y="146" text-anchor="middle" fill="#3fb950" font-weight="700" font-size="14">CLOSED</text><text x="160" y="164" text-anchor="middle" fill="#8b98a9" font-size="11">정상 호출</text>
    <circle cx="450" cy="150" r="58" fill="#121821" stroke="#ff4438"/><text x="450" y="146" text-anchor="middle" fill="#ff4438" font-weight="700" font-size="14">OPEN</text><text x="450" y="164" text-anchor="middle" fill="#8b98a9" font-size="11">즉시 실패 · 폴백</text>
    <circle cx="740" cy="150" r="58" fill="#121821" stroke="#d29922"/><text x="740" y="146" text-anchor="middle" fill="#d29922" font-weight="700" font-size="14">HALF-OPEN</text><text x="740" y="164" text-anchor="middle" fill="#8b98a9" font-size="11">시험 호출 몇 건</text>
  </g>
  <g fill="none" stroke="#8b98a9" marker-end="url(#a)">
    <path d="M218 135 Q305 100 392 135"/>
    <path d="M508 135 Q595 100 682 135"/>
    <path d="M682 165 Q595 200 508 165"/>
    <path d="M700 200 Q450 275 210 190"/>
  </g>
  <g fill="#8b98a9" font-size="11">
    <text x="245" y="105">실패율 &gt; 50% (최근 20건)</text>
    <text x="545" y="105">쿨다운 30s 경과</text>
    <text x="560" y="222">시험 실패 → 다시 OPEN</text>
    <text x="380" y="262">시험 성공 N건 → CLOSED</text>
  </g>
  <text x="30" y="290" fill="#8b98a9" font-size="11">OPEN 상태는 의존성에 회복할 시간을 주고, 호출 측의 스레드·커넥션을 지킨다. 상태를 Redis 에 공유하면 인스턴스 전체가 함께 열려 재시도 폭풍을 막는다.</text>
</svg>
