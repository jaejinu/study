# 학습용 Redis 설정. 프로젝트 루트에서 `pnpm redis` 로 실행한다.
# 데이터 디렉터리(dir)는 실행 환경마다 다르므로 명령줄에서 넘긴다:
#   로컬:   redis-server redis/redis.conf --dir redis/data
#   Docker: redis-server /usr/local/etc/redis/redis.conf --dir /data
port 6379
bind 127.0.0.1
protected-mode yes
daemonize no
loglevel notice

# ---- 영속성 (notes: 04-persistence) ----
dbfilename dump.rdb
save 60 1
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# ---- 메모리 (notes: 03-keys-expiration, 12-memory-performance) ----
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---- 관측 ----
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100
