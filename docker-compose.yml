# 이 프로젝트의 Redis 를 Docker 로 띄운다. (Docker 노트 05-compose 참고)
#   pnpm redis:docker        # = docker compose up -d redis
#   pnpm redis:docker:down
services:
  redis:
    image: redis:8-alpine
    container_name: study-redis
    # redis.conf 의 bind 127.0.0.1 은 컨테이너 안의 루프백이라 호스트에서 접속이 안 된다 → 0.0.0.0 으로 덮어쓴다
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--dir", "/data", "--bind", "0.0.0.0", "--protected-mode", "no"]
    ports:
      - "127.0.0.1:6379:6379"   # 호스트 루프백에만 공개 (같은 네트워크의 다른 기기에서 접근 불가)
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 앱까지 함께: docker compose --profile app up -d --build  →  http://localhost:3200
  web:
    build: .
    image: study:dev
    container_name: study-web
    profiles: ["app"]
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- Kafka (KRaft 단일 브로커) : pnpm kafka:up ----
  kafka:
    image: apache/kafka:3.9.1
    container_name: study-kafka
    profiles: ["kafka"]
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 내부(PLAINTEXT:9092) / 컨트롤러(9093) / 호스트용(EXTERNAL:19092) 리스너
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- PostgreSQL : pnpm pg:up ----
  postgres:
    image: postgres:16-alpine
    container_name: study-postgres
    profiles: ["postgres"]
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 관측성: Prometheus + redis_exporter + Grafana : pnpm obs:up ----
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: study-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver     # Tempo metrics-generator 가 span 메트릭을 밀어 넣는다
      - --enable-feature=exemplar-storage
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    container_name: study-redis-exporter
    profiles: ["observability"]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
  # 로그: Loki (저장) + Alloy (수집: 컨테이너 stdout, 앱 logs/app.jsonl)
  loki:
    image: grafana/loki:3.4.2
    container_name: study-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:13100:3100"
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
  alloy:
    image: grafana/alloy:v1.7.5
    container_name: study-alloy
    profiles: ["observability"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    ports:
      - "127.0.0.1:12346:12345"
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/app-logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
  # 트레이스: Tempo (OTLP 수신). 앱은 OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:14318 로 보낸다
  tempo:
    image: grafana/tempo:2.7.2
    container_name: study-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:13200:3200"
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:14318:4318"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
  grafana:
    image: grafana/grafana:11.6.0
    container_name: study-grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ---- Nginx 리버스 프록시 (호스트의 pnpm dev 앞에) : pnpm nginx:up ----
  nginx:
    image: nginx:1.27-alpine
    container_name: study-nginx
    profiles: ["nginx"]
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis-data:
  pg-data:
  loki-data:
  tempo-data:
