# Prometheus 설정 (관측성 노트 02 참고). pnpm obs:up
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Redis → redis_exporter 가 INFO 를 메트릭으로 변환
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # 이 앱의 /api/metrics (호스트에서 pnpm dev 로 실행 중일 때)
  - job_name: study-app
    metrics_path: /api/metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
