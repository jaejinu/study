# pnpm k8s:up  (= kubectl kustomize --load-restrictor LoadRestrictionsNone k8s | kubectl apply -f -)
# kustomize 는 기본적으로 디렉터리 밖 파일(../redis/redis.conf) 참조를 막는다 → load-restrictor 로 허용
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: study
resources:
  - namespace.yaml
  - redis.yaml
configMapGenerator:
  # 프로젝트의 redis.conf 를 그대로 ConfigMap 으로 (내용이 바뀌면 이름에 해시가 붙어 롤링 재시작된다)
  - name: redis-config
    files:
      - redis.conf=../redis/redis.conf
