# NetworkPolicy 실험용 kind 클러스터 (기본 CNI kindnet 은 NetworkPolicy 를 강제하지 않으므로 Calico 를 쓴다)
#   pnpm k8s:netpol        → 클러스터 생성 + Calico 설치 (컨텍스트 kind-study-netpol)
#   pnpm k8s:netpol:down   → 삭제
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: study-netpol
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
  - role: control-plane
