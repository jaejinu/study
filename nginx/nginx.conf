# Study 앱 앞에 세우는 리버스 프록시 (Nginx 노트 참고). pnpm nginx:up → http://localhost:18080
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # 구조화 로그: 어떤 업스트림이 얼마나 걸렸는지
  log_format study '$remote_addr "$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time cache=$upstream_cache_status';
  access_log /dev/stdout study;
  error_log  /dev/stderr warn;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # 레이트 리밋: IP 당 초당 10 요청, 버스트 20
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

  # 프록시 캐시 (정적 자원용)
  proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=static:10m max_size=100m inactive=10m;

  # 업스트림: 호스트에서 실행 중인 pnpm dev (여러 대면 줄을 추가해 로드밸런싱)
  upstream study_app {
    server host.docker.internal:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    # 헬스체크용 (업스트림까지 가지 않음)
    location = /health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Nginx 자체 상태 (stub_status)
    location = /nginx_status {
      stub_status;
      allow 127.0.0.1; allow 172.16.0.0/12; allow 192.168.0.0/16; allow 10.0.0.0/8;
      deny all;
    }

    # 정적 자원: 캐시 + 긴 만료
    location /_next/static/ {
      proxy_pass http://study_app;
      proxy_cache static;
      proxy_cache_valid 200 10m;
      add_header X-Cache $upstream_cache_status;
      expires 7d;
    }

    # 나머지: 프록시 (헤더 전달, 레이트 리밋)
    location / {
      limit_req zone=perip burst=20 nodelay;
      proxy_pass http://study_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
      add_header X-Served-By nginx;
    }
  }
}
