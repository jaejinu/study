# TLS 종단 리버스 프록시 (보안 노트 02 · Nginx 노트 03). pnpm nginx:tls → https://localhost:18444
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  log_format tls '$remote_addr "$request" $status ssl=$ssl_protocol/$ssl_cipher sni=$ssl_server_name rt=$request_time';
  access_log /dev/stdout tls;
  error_log  /dev/stderr warn;

  upstream study_app { server host.docker.internal:3000; keepalive 16; }

  # 80 → 443 리다이렉트 (평문은 받지 않는다)
  server {
    listen 80;
    return 301 https://$host:18444$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name localhost study.local;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    # 프로토콜·암호: TLS 1.2 이상, 1.3 은 스위트 고정이라 1.2 용만 지정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;       # 1.3 시대엔 클라이언트 선호를 존중
    ssl_session_cache shared:SSL:10m;    # 세션 재개로 핸드셰이크 비용 절감
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 주의: location 안에 add_header 를 하나라도 쓰면 server 의 add_header 를 상속하지 않는다 (HSTS 가 빠진다)
    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / {
      proxy_pass http://study_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;   # 앱이 "https 로 왔다" 를 알도록
      proxy_set_header Connection "";
      proxy_read_timeout 120s;
    }
  }
}
